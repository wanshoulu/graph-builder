// ══════════════ Add Node Modal ══════════════
function openAddNodeModal(){document.getElementById('addNodeModal').classList.add('show');onNodeTypeChange();}
function onNodeTypeChange(){
  var t=document.getElementById('newNodeType').value;
  var hints={intent_node:'📄 叶子意图 — 用户一句话对应的最终意图',aggregate_intent:'📁 聚合意图 — 分类容器',business_object:'📦 业务对象 — 意图操作的目标',action:'⚡ 动作 — 原子操作',slot:'🔧 槽位 — 意图参数',state_constraint:'🚦 状态约束 — 前置条件',risk:'⚠️ 风险 — 风控规则',knowledge_answer:'💡 知识答案 — FAQ内容',runtime_boundary:'🚫 运行时边界 — 非业务输入'};
  document.getElementById('newNodeHint').textContent=hints[t]||'';
  var f=document.getElementById('newNodeFields');
  if(t==='intent_node'){f.innerHTML='<label>名称</label><input id="nf_name" placeholder="如 查询余额"><label>意图类型</label><select id="nf_itype">'+(S.schema.intent_types||[]).map(function(x){return'<option value="'+x+'">'+x+' '+(INTENT_CN[x]||'')+'</option>';}).join('')+'</select><label>领域</label><select id="nf_domain">'+S.schema.domains.map(function(x){return'<option>'+x+'</option>';}).join('')+'</select><label>父聚合ID (可选)</label><input id="nf_pid" placeholder="留空=无">';}
  else if(t==='aggregate_intent'){f.innerHTML='<label>名称</label><input id="nf_name" placeholder="如 账户查询"><label>领域</label><select id="nf_domain">'+S.schema.domains.map(function(x){return'<option>'+x+'</option>';}).join('')+'</select>';}
  else{var ph={business_object:'如 账户余额',action:'如 查询',slot:'如 金额',state_constraint:'如 已登录',risk:'如 超额风险',knowledge_answer:'如 余额说明',runtime_boundary:'如 idle_chat'};f.innerHTML='<label>名称</label><input id="nf_name" placeholder="'+(ph[t]||'')+'">';}
}

function confirmAddNode(){
  var t=document.getElementById('newNodeType').value,name=document.getElementById('nf_name').value.trim();
  if(!name){alert('请输入名称');return;}if(!S.graph){alert('请先新建或加载图谱');return;}
  var idMap={intent_node:'intent_leaf_',aggregate_intent:'intent_group_node_',business_object:'obj_',action:'act_',slot:'slot_',state_constraint:'state_',risk:'risk_',knowledge_answer:'knowledge_',runtime_boundary:'rb_'};
  var id=idMap[t]+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  if(t==='intent_node'){
    if(!S.graph.intent_nodes)S.graph.intent_nodes=[];
    var itype=document.getElementById('nf_itype').value,domain=document.getElementById('nf_domain').value,pid=document.getElementById('nf_pid').value.trim(),isKnow=itype==='ASK'||itype==='HELP';
    S.graph.intent_nodes.push({identity:{intent_id:id,intent_name:name,intent_type:itype,intent_level:'leaf',parent_intent_id:pid||null,domain:domain,is_executable_leaf:!isKnow,is_knowledge_intent:isKnow},semantic_definition:{user_goal:name,description:'手工建模 — '+name,scope_in:[name],scope_out:[],confusable_intents:[],disambiguation_hints:[]},retrieval_profile:{utterance_view:[name],semantic_view:[name],object_view:[],action_view:[itype.toLowerCase()],weights:{}},task_binding:isKnow?null:{action:{action_code:'query',action_name:'查询'},business_object:{object_name:name,object_type:''}},knowledge_binding:isKnow?{knowledge_refs:[],answer_policy:'direct_answer_or_recommend_entry'}:null,decision_policy:{default_decision:isKnow?'answer':'execute',low_confidence_strategy:'keep_topk_then_graph_reasoning_or_clarify',clarify_questions:[],reject_policy:'fallback_when_out_of_scope'},execution_binding:{route_type:isKnow?'answer':'action_execution',standard_navigation_path:'',source_navigation_paths:[],route_readiness:'draft'},governance:{quality_flags:['expert_draft'],review_status:'draft'}});
  }else if(t==='aggregate_intent'){
    if(!S.graph.aggregate_intents)S.graph.aggregate_intents=[];
    var domain=document.getElementById('nf_domain').value;
    S.graph.aggregate_intents.push({intent_id:id,intent_name:name,intent_level:'aggregate',domain:domain,modeling_role:'intent_candidate',semantic_definition:{user_goal:name,description:'手工建模 — '+name,scope_in:[name],scope_out:[]}});
  }else{
    if(!S.graph.supporting_nodes)S.graph.supporting_nodes={};
    var snMap={business_object:'business_objects',action:'actions',slot:'slots',state_constraint:'states',risk:'risks',knowledge_answer:'knowledge_answers',runtime_boundary:'runtime_boundaries'},snKey=snMap[t];
    if(!S.graph.supporting_nodes[snKey])S.graph.supporting_nodes[snKey]=[];
    var idF={business_object:'object_id',action:'action_id',slot:'slot_id',state_constraint:'state_id',risk:'risk_id',knowledge_answer:'knowledge_id',runtime_boundary:'runtime_boundary_id'};
    var nmF={business_object:'object_name',action:'action_name',slot:'slot_name',state_constraint:'state_name',risk:'risk_name',knowledge_answer:'knowledge_name',runtime_boundary:'runtime_boundary_name'};
    var obj={};obj[idF[t]]=id;obj[nmF[t]]=name;S.graph.supporting_nodes[snKey].push(obj);
  }
  S.dirty=true;closeModal();renderAll();setBadge('ok','已添加: '+name);
}

function deleteNode(id){
  ['intent_nodes','aggregate_intents'].forEach(function(k){if(S.graph[k])S.graph[k]=S.graph[k].filter(function(n){return getNodeId(n)!==id;});});
  var sn=S.graph.supporting_nodes||{};Object.keys(sn).forEach(function(k){sn[k]=sn[k].filter(function(n){return getNodeId(n)!==id;});});
  S.graph.edges=(S.graph.edges||[]).filter(function(e){return(e.from||e.source)!==id&&(e.to||e.target)!==id;});S.dirty=true;
}

// ══════════════ Add Edge ══════════════
function confirmAddEdge(){
  var type=document.getElementById('newEdgeType').value;
  if(!S.graph.edges)S.graph.edges=[];
  S.graph.edges.push({edge_id:'edge_'+Date.now().toString(36),from:S.edgeSrc,to:S.edgeTgt,type:type,relation_category:'hierarchy',status:'active',version:'v2.1-p2-manual',owner:'expert'});
  S.dirty=true;closeEdgeModal();renderAll();setBadge('ok','已添加边: '+type);
}

// ══════════════ Validate / Export ══════════════
async function onValidate(){
  if(!S.graph){alert('请先新建或加载图谱');return;}
  try{
    var r=await fetch('/api/intent-graph/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({graph:S.graph})});
    var j=await r.json(),panel=document.getElementById('validation');panel.style.display='block';
    S.lastValidation=j;
    var modeling=j.modeling||{errors:[],warnings:[]};
    if(j.errors.length===0&&modeling.errors.length===0){
      panel.innerHTML='<div class="v-ok">✓ 校验通过</div>'+(modeling.warnings.length?'<div style="color:var(--orange);margin-top:4px">'+modeling.warnings.slice(0,8).map(function(e){return'<div>'+esc(e)+'</div>';}).join('')+'</div>':'');
      setBadge('ok','校验通过');
    } else {
      panel.innerHTML='<div style="color:var(--red);font-weight:600;margin-bottom:4px">✗ '+(j.errors.length+modeling.errors.length)+' 错误</div>'+
        j.errors.slice(0,20).map(function(e){return'<div class="v-err">'+esc(e)+'</div>';}).join('')+
        modeling.errors.slice(0,10).map(function(e){return'<div class="v-err">'+esc(e)+'</div>';}).join('')+
        (modeling.warnings.length?'<div style="color:var(--orange);margin-top:6px">'+modeling.warnings.slice(0,8).map(function(e){return'<div>'+esc(e)+'</div>';}).join('')+'</div>':'');
      setBadge('err',(j.errors.length+modeling.errors.length)+' 错误');
    }
    renderAll();
  }catch(e){alert('校验失败: '+e.message);}
}
async function onExport(){
  if(!S.graph){alert('请先新建或加载图谱');return;}
  var v=prompt('导出版本号:','intent-graph-v2.1-p2-batch1');if(!v)return;
  var changes=prompt('变更说明:','低码工作台导出候选版本');if(!changes)return;
  try{
    var r=await fetch('/api/intent-graph/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({graph:S.graph,version:v,changes:changes,release_stage:'p2_candidate',release_status:'candidate',promote_to_active:false})});
    var j=await r.json();
    if(j.success){alert('导出成功!\n文件: '+j.file+'\n状态: '+(j.release_status||'candidate')+'\n节点: '+j.stats.intent_nodes+' 叶子 + '+j.stats.aggregate_intents+' 聚合\n边: '+j.stats.edges);setBadge('ok','已导出候选');}
    else{alert('导出失败: '+(j.errors||[]).length+' 错误');}
  }catch(e){alert('导出失败: '+e.message);}
}

// ══════════════ Utils ══════════════
function renderAll(){renderNodeTree();renderStats();renderG6();if(!S.selNodeId&&S.selEdgeIdx===null&&!S.guideMode)renderInspectorEmpty();}

function getNodeType(n){
  if(S.graph.aggregate_intents&&S.graph.aggregate_intents.indexOf(n)>=0)return'aggregate_intent';
  if(S.graph.intent_nodes&&S.graph.intent_nodes.indexOf(n)>=0)return'intent_node';
  return n.node_type||(n.identity?'intent_node':'unknown');
}
function getNodeId(n){
  if(n.identity)return n.identity.intent_id;
  return n.intent_id||n.object_id||n.action_id||n.knowledge_id||n.slot_id||n.state_id||n.risk_id||n.runtime_boundary_id||n.id||'';
}
function getNodeName(n){
  if(n.identity)return n.identity.intent_name;
  return n.intent_name||n.object_name||n.action_name||n.knowledge_name||n.slot_name||n.state_name||n.risk_name||n.runtime_boundary_name||n.name||getNodeId(n);
}
function getAllNodes(){
  if(!S.graph)return [];
  var arr=[];
  (S.graph.intent_nodes||[]).forEach(function(n){arr.push({node:n,type:'intent_node'});});
  (S.graph.aggregate_intents||[]).forEach(function(n){arr.push({node:n,type:'aggregate_intent'});});
  var sn=S.graph.supporting_nodes||{};
  ['business_objects','actions','slots','states','risks','knowledge_answers','runtime_boundaries'].forEach(function(k){
    var tm={business_objects:'business_object',actions:'action',slots:'slot',states:'state_constraint',risks:'risk',knowledge_answers:'knowledge_answer',runtime_boundaries:'runtime_boundary'};
    (sn[k]||[]).forEach(function(n){arr.push({node:n,type:tm[k]});});
  });
  return arr;
}
function findNodeById(id){var all=getAllNodes();for(var i=0;i<all.length;i++){if(getNodeId(all[i].node)===id)return all[i].node;}return null;}
function closeModal(){document.getElementById('addNodeModal').classList.remove('show');}
function closeEdgeModal(){document.getElementById('addEdgeModal').classList.remove('show');S.edgeSrc=S.edgeTgt=null;}

// ══════════════ Edge Selection & Editing ══════════════
function findEdgeIdx(eid){
  var edges=S.graph.edges||[];
  for(var i=0;i<edges.length;i++){if((edges[i].edge_id||edges[i].id)===eid)return i;}
  return -1;
}
function selectEdge(idx){
  S.selNodeId=null;S.selEdgeIdx=idx;
  var edges=S.graph.edges||[],e=idx>=0&&idx<edges.length?edges[idx]:null;
  renderNodeTree();
  renderG6();
  highlightSelectedEdge();
  showEdgeDetail(e,idx);
}
function showEdgeDetail(e,idx){
  if(!e){document.getElementById('infoContent').innerHTML='<div class="info-empty">边未找到</div>';return;}
  var src=e.from||e.source,tgt=e.to||e.target;
  var srcNode=findNodeById(src),tgtNode=findNodeById(tgt);
  document.getElementById('infoContent').innerHTML=renderStageTabs()+renderEdgeEditHTML(e,idx,src,tgt,srcNode,tgtNode)+renderStageChecklist();
}
function renderEdgeEditHTML(e,idx,src,tgt,srcNode,tgtNode){
  var etype=e.type||'related_to',ecn=EDGE_CN[etype]||'';
  var html='';
  html+='<div class="detail-header">';
  html+='<div class="dh-name">🔗 编辑边</div>';
  html+='<div class="dh-id">'+(e.edge_id||e.id||('e'+idx))+'</div>';
  html+='</div>';
  html+='<div class="detail-section"><div class="detail-section-title">📋 基本信息</div>';
  html+=fg('edge_type','边类型','select',etype,(S.schema.edge_types||[]).map(function(t){return{value:t,label:t+' ('+(EDGE_CN[t]||'')+')'};}),true);
  html+=fg('edge_rc','关系类别','text',e.relation_category||'');
  html+=fg('edge_st','状态','select',e.status||'active',[{value:'active',label:'active — 生效中'},{value:'draft',label:'draft — 草稿'},{value:'deprecated',label:'deprecated — 已废弃'},{value:'review',label:'review — 待审核'}]);
  html+=fg('edge_wt','权重','number',e.weight||1);
  html+=fg('edge_pr','优先级','number',e.priority||100);
  html+='</div>';
  html+='<div class="detail-section"><div class="detail-section-title">🔗 端点</div>';
  html+='<div class="fg"><label>源节点（from）</label><div style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:11px;background:var(--bg2)">'+(srcNode?esc(getNodeName(srcNode))+' <span style="color:var(--text2);font-size:9px">('+esc(src)+')</span>':esc(src))+'</div></div>';
  html+='<div class="fg"><label>目标节点（to）</label><div style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:11px;background:var(--bg2)">'+(tgtNode?esc(getNodeName(tgtNode))+' <span style="color:var(--text2);font-size:9px">('+esc(tgt)+')</span>':esc(tgt))+'</div></div>';
  html+='</div>';
  html+='<button class="btn-save" onclick="saveEdgeAndRefresh()">💾 保存修改</button>';
  html+='<button style="display:block;width:100%;padding:8px;margin-top:6px;cursor:pointer;background:none;color:var(--red);border:1px solid var(--red);border-radius:6px;font-size:12px;font-weight:600" onclick="deleteEdgeFromPanel()">🗑 删除此边</button>';
  return html;
}
function saveEdgeAndRefresh(){
  if(S.selEdgeIdx===null||S.selEdgeIdx<0)return;
  var edges=S.graph.edges||[];if(S.selEdgeIdx>=edges.length)return;
  var e=edges[S.selEdgeIdx];
  var els=document.getElementById('infoContent').querySelectorAll('input,select');
  els.forEach(function(el){
    var id=el.id,val=el.value;if(!id)return;
    if(id==='edge_type')e.type=val;
    else if(id==='edge_rc')e.relation_category=val;
    else if(id==='edge_st')e.status=val;
    else if(id==='edge_wt')e.weight=parseFloat(val)||1;
    else if(id==='edge_pr')e.priority=parseInt(val)||100;
  });
  S.dirty=true;
  // Re-render canvas + tree, keep edge editor visible
  renderNodeTree();renderG6();renderStats();
  showEdgeDetail(e,S.selEdgeIdx);
  setBadge('ok','边已保存');
}
function deleteEdgeFromPanel(){
  if(S.selEdgeIdx===null||S.selEdgeIdx<0)return;
  var edges=S.graph.edges||[];if(S.selEdgeIdx>=edges.length)return;
  var e=edges[S.selEdgeIdx],desc=(EDGE_CN[e.type]||e.type)+' ['+((e.from||e.source)||'')+' → '+(e.to||e.target)+']';
  if(!confirm('确认删除此边？\n'+desc))return;
  edges.splice(S.selEdgeIdx,1);S.selEdgeIdx=null;S.dirty=true;
  renderAll();setBadge('ok','边已删除');
}
function highlightSelectedEdge(){
  if(!S.g6)return;
  try{
    var allEdges=S.graph.edges||[];
    if(S.selEdgeIdx!==null&&S.selEdgeIdx>=0&&S.selEdgeIdx<allEdges.length){
      var eid=allEdges[S.selEdgeIdx].edge_id||allEdges[S.selEdgeIdx].id;
      if(eid)S.g6.setElementState(eid,{selected:true});
    }
    S.g6.draw();
  }catch(e){}
}

// ══════════════ Form Helpers ══════════════
function section(title,body){return'<details open style="margin-bottom:6px"><summary style="font-size:10px;font-weight:600;color:var(--accent);cursor:pointer">'+title+'</summary><div style="padding:3px 0">'+body+'</div></details>';}
function fg(id,label,type,value,opts,required){
  var input='',reqMark=required?' <span style="color:var(--red);font-weight:700">*</span>':'';
  if(type==='select'&&opts)input='<select id="'+id+'"'+(required?' data-required="1"':'')+'>'+opts.map(function(o){var v=typeof o==='object'?o.value:o,l=typeof o==='object'?o.label:o;return'<option value="'+esc(v)+'"'+(v===value?' selected':'')+'>'+esc(l)+'</option>';}).join('')+'</select>';
  else input='<input type="'+type+'" id="'+id+'" value="'+esc(String(value||''))+'"'+(required?' data-required="1"':'')+'>';
  return'<div class="fg"><label>'+label+reqMark+'</label>'+input+'</div>';
}
function fgText(id,label,value,required){
  var reqMark=required?' <span style="color:var(--red);font-weight:700">*</span>':'';
  return'<div class="fg"><label>'+label+reqMark+'</label><textarea id="'+id+'"'+(required?' data-required="1"':'')+'>'+esc(String(value||''))+'</textarea></div>';
}
function arrEd(id,label,arr){
  var items=(arr||[]).map(function(v,i){return'<div class="array-row"><input value="'+esc(String(v))+'" data-arr="'+id+'" data-idx="'+i+'"><button onclick="this.parentElement.remove();S.dirty=true">×</button></div>';}).join('');
  return'<div class="fg"><label>'+label+'</label>'+items+'<button class="array-add" onclick="addArrItem(\''+id+'\')">+</button></div>';
}
function addArrItem(id){
  var container=document.querySelector('[data-arr="'+id+'"]'),parent=container?container.parentElement:null;if(!parent)return;
  var div=document.createElement('div');div.className='array-row';
  div.innerHTML='<input value="" data-arr="'+id+'" data-idx="'+parent.querySelectorAll('.array-row').length+'"><button onclick="this.parentElement.remove();S.dirty=true">×</button>';
  parent.insertBefore(div,parent.querySelector('.array-add'));
}
function setBadge(type,msg){var b=document.getElementById('badge');b.textContent=msg;b.className='badge badge-'+(type==='ok'?'ok':type==='err'?'err':'warn');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ══════════════ Panel Resize ══════════════
var _resizeInfo=null;

function startResize(e, handleId){
  e.preventDefault();
  _resizeInfo={handleId:handleId,startX:e.clientX};
  document.getElementById(handleId).classList.add('active');
  document.body.style.cursor='col-resize';
  document.body.style.userSelect='none';
  document.addEventListener('mousemove',onResizeMove);
  document.addEventListener('mouseup',onResizeEnd);
}

function onResizeMove(e){
  if(!_resizeInfo)return;
  var dx=e.clientX-_resizeInfo.startX;
  _resizeInfo.startX=e.clientX;
  var main=document.querySelector('.main');
  var totalW=main.clientWidth;
  var left=document.getElementById('wsPanel');
  var right=document.getElementById('infoPanel');
  var leftW=left.offsetWidth,rightW=right.offsetWidth;
  var minCenter=350;

  if(_resizeInfo.handleId==='resizeHandle1'){
    // Left handle: adjust wsPanel width, center takes rest
    var newW=Math.max(220,Math.min(leftW+dx,totalW-rightW-minCenter-10));
    left.style.width=newW+'px';
  }else{
    // Right handle: adjust infoPanel width, center takes rest
    var newW=Math.max(220,Math.min(rightW-dx,totalW-leftW-minCenter-10));
    right.style.width=newW+'px';
  }
  // Trigger G6 resize
  if(S.g6)try{var c=document.getElementById('g6container');S.g6.setSize(c.parentElement.clientWidth,c.parentElement.clientHeight);}catch(e){}
}

function onResizeEnd(){
  document.querySelectorAll('.resize-handle').forEach(function(h){h.classList.remove('active');});
  document.body.style.cursor='';
  document.body.style.userSelect='';
  document.removeEventListener('mousemove',onResizeMove);
  document.removeEventListener('mouseup',onResizeEnd);
  _resizeInfo=null;
}
