<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图谱构建（意图 + 组织图谱）| graph-builder</title>
<script>var G6_LOADED=false;var DOMAIN={current:'intent'};</script>
<script src="vendor/g6.min.js" onload="G6_LOADED=true" onerror="G6_LOADED=false"></script>
<style>
:root {
  --bg:#fff;--bg2:#f8f9fb;--bg3:#f0f2f5;--border:#e5e7eb;
  --text:#1f2937;--text2:#9ca3af;--accent:#2563eb;--green:#16a34a;
  --orange:#ea580c;--red:#dc2626;--purple:#7c3aed;
  --radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg3);color:var(--text);height:100vh;overflow:hidden}

/* Top bar */
.topbar{height:44px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:6px;flex-shrink:0}
.topbar .logo{font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap}
.topbar .sep{flex:1}
.topbar .btn-group{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.topbar .btn-group button{border-radius:0;border:none;border-right:1px solid var(--border)}
.topbar .btn-group button:last-child{border-right:none}
.topbar select,.topbar button{font-family:var(--font);font-size:12px;padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);height:32px;transition:all .15s}
.topbar select{min-width:170px}
.topbar button{cursor:pointer;font-weight:500;white-space:nowrap}
.topbar button:hover{background:var(--bg3)}
.topbar .btn-pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.topbar .btn-pri:hover{background:#1d4ed8}
.topbar .btn-ok{background:var(--green);color:#fff;border-color:var(--green)}
.topbar .btn-ok:hover{background:#15803d}
.badge{padding:2px 10px;border-radius:12px;font-size:10px;font-weight:600}
.badge-ok{background:#dcfce7;color:var(--green)}
.badge-err{background:#fef2f2;color:var(--red)}
.badge-warn{background:#fffbeb;color:var(--orange)}

/* == Three-column main == */
.main{flex:1;display:flex;overflow:hidden}

/* Resize handle */
.resize-handle{width:5px;cursor:col-resize;background:transparent;flex-shrink:0;position:relative;z-index:5;transition:background .15s}
.resize-handle:hover,.resize-handle.active{background:var(--accent)}
.resize-handle::after{content:'';position:absolute;inset:-4px 0}

/* Left: Workspace (default 32%) */
.ws-panel{min-width:220px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.ws-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bg3);flex-shrink:0}
.ws-toolbar input{flex:1;padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:var(--font);outline:none;transition:border-color .15s}
.ws-toolbar input:focus{border-color:var(--accent)}
.ws-toolbar button{padding:7px 16px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;transition:background .15s}
.ws-toolbar button:hover{background:#1d4ed8}
.ws-table-wrap{flex:1;overflow-y:auto}
.ws-table-wrap table{width:100%;border-collapse:collapse;font-size:11px}
.ws-table-wrap thead{position:sticky;top:0;z-index:2}
.ws-table-wrap th{background:var(--bg2);padding:7px 8px;text-align:left;font-size:10px;font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
.ws-table-wrap th:hover{color:var(--accent)}
/* Tree view - recursive multi-level */
.tree-wrap{flex:1;overflow-y:auto;padding:0}

/* Domain header — simple collapsible, like a folder */
.tree-dm-hd{display:flex;align-items:center;gap:4px;padding:6px 8px;cursor:pointer;font-size:11px;font-weight:600;color:var(--text);user-select:none;border-top:1px solid var(--border);margin-top:-1px}
.tree-dm-hd:hover{background:var(--bg2)}
.tree-dm-hd .tree-arw{font-size:8px;width:14px;flex-shrink:0;color:var(--text2);transition:transform .15s;text-align:center}
.tree-dm-hd .tree-arw.open{transform:rotate(90deg)}
.tree-dm-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-dm-name.tree-dm-empty{color:var(--text2)}
.tree-dm-meta{font-size:9px;color:var(--text2);font-weight:400;flex-shrink:0}
.tree-dm-body{padding:0}

/* Recursive tree rows with connector lines */
.tree-row{display:flex;align-items:center;gap:4px;padding:3px 8px;cursor:pointer;font-size:10px;transition:background .1s;position:relative;min-height:22px}
.tree-row:hover{background:#f0f5ff}
.tree-row.active{background:#e6f4ff;font-weight:600}
.tree-row.tree-agg-row{font-weight:600;font-size:11px}
.tree-row.tree-agg-row:hover{background:#f5f0ff}
.tree-row.tree-agg-row.active{background:#f0e8ff}
.tree-row .tree-arw{font-size:8px;width:14px;flex-shrink:0;color:var(--text2);transition:transform .15s;text-align:center}
.tree-row .tree-arw.open{transform:rotate(90deg)}
.tree-row .tree-lv{position:absolute;width:1px;background:var(--border);top:0;bottom:0}
.tree-row .tree-lh{position:absolute;height:1px;background:var(--border);top:50%}
.tree-row:last-child .tree-lv{bottom:50%}
.tree-row .tree-row-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .tree-row-type{font-size:8px;padding:1px 5px;border-radius:3px;color:#fff;font-weight:600;flex-shrink:0;white-space:nowrap}
.tree-row .tree-row-actions{display:none;gap:2px;flex-shrink:0}
.tree-row:hover .tree-row-actions{display:flex}
.tree-row .tree-row-actions button{padding:0 4px;font-size:9px;border:1px solid var(--border);border-radius:3px;background:var(--bg);cursor:pointer}
.tree-row .tree-row-actions button.del{color:var(--red);border-color:transparent}
.tree-row .tree-row-actions button.del:hover{background:#fff2f0}

/* Supporting nodes section */
.tree-sup-hd{padding:10px 10px 5px;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;border-top:2px solid var(--border);margin-top:4px}
.tree-sup-node{display:flex;align-items:center;gap:5px;padding:3px 10px;cursor:pointer;font-size:10px;border-radius:3px;margin:1px 4px;transition:background .1s}
.tree-sup-node:hover{background:#f0f5ff}
.tree-sup-node.active{background:#e6f4ff;font-weight:600}
.tree-sup-node .sup-icon{font-size:11px;flex-shrink:0;width:16px;text-align:center}
.tree-sup-node .sup-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-sup-node .sup-type{font-size:8px;padding:1px 5px;border-radius:3px;color:#fff;font-weight:600;flex-shrink:0}
.tree-sup-node .tn-actions{display:none;gap:2px;flex-shrink:0}
.tree-sup-node:hover .tn-actions{display:flex}
.tree-sup-node .tn-actions button{padding:0 4px;font-size:9px;border:1px solid var(--border);border-radius:3px;background:var(--bg);cursor:pointer}
.tree-sup-node .tn-actions button.del{color:var(--red);border-color:transparent}
.tree-empty{padding:40px 16px;text-align:center;color:var(--text2);font-size:12px}
.type-tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;color:#fff;font-weight:600;white-space:nowrap}
.type-tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;color:#fff;font-weight:600;white-space:nowrap}
.ws-stats{padding:5px 10px;font-size:10px;color:var(--text2);border-top:1px solid var(--border);flex-shrink:0;display:flex;justify-content:space-between}

/* Node type palette for drag-drop */
.node-palette{padding:6px 8px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.node-palette .np-title{font-size:9px;font-weight:600;color:var(--text2);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.node-palette .np-title::before{content:'📦'}
.node-palette .np-grid{display:flex;flex-wrap:wrap;gap:4px}
.node-palette .np-item{padding:3px 7px;border-radius:5px;font-size:9px;font-weight:500;cursor:grab;transition:all .15s;user-select:none;border:1px solid transparent;display:flex;align-items:center;gap:3px}
.node-palette .np-item:hover{background:var(--bg);border-color:var(--border);transform:translateY(-1px)}
.node-palette .np-item:active{cursor:grabbing;transform:scale(0.95)}
.node-palette .np-item.dragging{opacity:0.5;background:var(--accent);color:#fff}
.node-palette .np-item .np-icon{font-size:10px}

/* Legend */
.legend-wrap{padding:6px 10px;border-top:1px solid var(--border);flex-shrink:0}
.legend-wrap .l-title{font-size:9px;font-weight:600;color:var(--text2);margin-bottom:4px}
.legend-row{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:9px;line-height:1.6}
.legend-row .ldot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;vertical-align:middle;flex-shrink:0}
.legend-row .litem{white-space:nowrap}

/* Center: Graph Canvas (42%) */
.gcanvas-panel{flex:1;min-width:350px;background:#f8f9fb;position:relative;display:flex;flex-direction:column}
.gcanvas-wrap{flex:1;position:relative}
.gcanvas-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text2);font-size:13px;flex-direction:column;gap:8px}
/* G6 create-edge ghost line */
.g6-create-edge{stroke:#2563eb!important;stroke-width:2.5!important;stroke-dasharray:6 3!important;pointer-events:none!important}
/* G6 node badges — port indicators rendered by G6 natively */
.g6-badge circle{pointer-events:none!important}
/* guide SVG unused, kept hidden */
.guide-svg{display:none!important}

/* Zoom toolbar (floating on canvas, bottom-left, like jena-fuseki-plus) */
.zoom-bar{position:absolute;bottom:12px;left:12px;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:8px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:10;user-select:none}
.zoom-bar button{width:28px;height:28px;border:none;background:none;cursor:pointer;border-radius:5px;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .15s,color .15s}
.zoom-bar button:hover{background:#ecf5ff;color:var(--accent)}
.zoom-bar .zoom-pct{font-size:10px;color:var(--text2);padding:2px 0;min-width:32px;text-align:center}
/* Graph info badge (floating bottom-right, like jena-fuseki-plus) */
.graph-badge{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:3px 10px;border-radius:10px;pointer-events:none;z-index:5}

/* Right: Info & Properties */
.info-panel{min-width:240px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;border-left:1px solid var(--border)}
.info-stats-bar{display:flex;align-items:center;gap:14px;padding:10px 14px;font-size:10px;color:var(--text2);border-bottom:1px solid var(--bg3);flex-shrink:0;flex-wrap:wrap}
.info-stats-bar .stat-chip{display:flex;align-items:center;gap:4px;white-space:nowrap}
.info-stats-bar .stat-chip .n{font-weight:700;color:var(--text)}
.info-content{flex:1;overflow-y:auto;padding:14px}
.info-empty{text-align:center;color:var(--text2);padding:80px 20px;font-size:13px;line-height:2.2}
.info-empty .icon{font-size:44px;margin-bottom:12px;display:block;opacity:.35}

/* Form elements */
.fg{margin-bottom:10px}
.fg label{display:block;font-size:10px;font-weight:600;color:var(--text2);margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.fg textarea{min-height:56px;resize:vertical}
.fg [data-required]{border-left:3px solid var(--red)}
.array-row{display:flex;gap:4px;margin-bottom:3px}
.array-row input{flex:1;font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:4px}
.array-row button{font-size:10px;padding:2px 8px;cursor:pointer;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--red);transition:background .1s}
.array-row button:hover{background:#fff2f0}
.array-add{font-size:10px;padding:3px 10px;cursor:pointer;border:1px dashed var(--border);border-radius:4px;background:none;color:var(--accent);margin-top:3px;transition:all .1s}
.array-add:hover{border-color:var(--accent);background:#f0f7ff}

/* Detail card sections */
.detail-header{padding:0 0 12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.detail-header .dh-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.detail-header .dh-id{font-family:monospace;font-size:10px;color:var(--text2);margin-bottom:6px;word-break:break-all}
.detail-section{margin-bottom:12px}
.detail-section-title{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--bg3);display:flex;align-items:center;gap:6px}
.detail-section-title::after{content:'';flex:1;height:1px;background:var(--bg3)}

/* Edge cards */
.edge-card{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:5px;font-size:11px;transition:all .1s}
.edge-card:hover{background:var(--bg2);border-color:#d1d5db}
.edge-card .ec-dir{font-weight:700;font-size:13px;width:20px;text-align:center;flex-shrink:0}
.edge-card .ec-dir.out{color:var(--green)}
.edge-card .ec-dir.in{color:var(--accent)}
.edge-card .ec-type{background:var(--bg3);padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600;white-space:nowrap;flex-shrink:0;color:var(--text2)}
.edge-card .ec-target{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.edge-card .ec-del{color:var(--text2);cursor:pointer;font-size:14px;flex-shrink:0;opacity:0;transition:all .1s;padding:2px;border-radius:4px}
.edge-card:hover .ec-del{opacity:1}
.edge-card .ec-del:hover{color:var(--red);background:#fef2f2}

/* Save button */
.btn-save{display:block;width:100%;padding:10px;margin-top:14px;cursor:pointer;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;transition:all .15s}
.btn-save:hover{background:#1d4ed8}
.btn-save:active{transform:scale(.98)}

.validation{background:var(--bg);border-top:1px solid var(--border);padding:8px 16px;max-height:120px;overflow-y:auto;font-size:11px;flex-shrink:0;display:none}
.validation .v-ok{color:var(--green);font-weight:600}
.validation .v-err{color:var(--red);font-family:monospace;line-height:1.6}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border-radius:10px;padding:24px;min-width:380px;max-width:520px;box-shadow:0 16px 48px rgba(0,0,0,.15)}
.modal h3{font-size:15px;margin-bottom:16px;font-weight:700}
.modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal label{font-size:12px;font-weight:600;display:block;margin-bottom:4px;color:var(--text2)}
.modal select,.modal input{width:100%;padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:12px;outline:none}
.modal select:focus,.modal input:focus{border-color:var(--accent)}

.ctx-menu{display:none;position:fixed;z-index:200;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:170px;padding:6px 0}
.ctx-menu .ctx-item{padding:8px 16px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s}
.ctx-menu .ctx-item:hover{background:var(--bg2)}
.ctx-menu .ctx-div{border-top:1px solid var(--border);margin:6px 0}
.ctx-menu .ctx-item.danger{color:var(--red)}
.ctx-menu .ctx-item.danger:hover{background:#fef2f2}

.guide-banner{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border-bottom:1px solid var(--border);padding:10px 14px;font-size:11px;line-height:1.6;flex-shrink:0}
.stage-tabs{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
.stage-tab{padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--bg2);font-size:11px;cursor:pointer;color:var(--text2);transition:all .15s}
.stage-tab.active{background:#eff6ff;border-color:#bfdbfe;color:var(--accent);font-weight:700}
.stage-card{margin:0 14px 12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg2)}
.stage-card h4{font-size:11px;margin-bottom:8px}
.stage-check{font-size:11px;line-height:1.7;color:var(--text2)}
.stage-check .ok{color:var(--green);font-weight:600}
.stage-check .warn{color:var(--orange);font-weight:600}
.stage-check .err{color:var(--red);font-weight:600}
.home-panel{padding:18px 14px 14px}
.home-hero{padding:14px;border:1px solid var(--border);border-radius:10px;background:linear-gradient(135deg,#fff,#f7fbff);margin-bottom:12px}
.home-hero h3{font-size:16px;margin-bottom:6px}
.home-hero p{font-size:12px;line-height:1.7;color:var(--text2)}
.home-grid{display:grid;grid-template-columns:1fr;gap:10px}
.home-action{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg)}
.home-action h4{font-size:13px;margin-bottom:6px}
.home-action p{font-size:11px;line-height:1.6;color:var(--text2);margin-bottom:8px}
.home-action .row{display:flex;gap:8px;flex-wrap:wrap}
.home-action button{padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:12px}
.home-action button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.home-action select{width:100%;margin-bottom:8px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg)}
.topbar .btn-accent{border-color:#7c3aed;color:#7c3aed}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#9ca3af}

/* ═══════ [IA] 信息架构壳：左导航（图谱类型注册制 + 领域插件）+ 阶段条（2026-08-25） ═══════ */
.ia-current{font-size:11px;color:var(--accent);background:#eff6ff;border:1px solid #bfdbfe;padding:3px 10px;border-radius:999px;white-space:nowrap}
.ia-shell{flex:1;display:flex;min-height:0}
.ia-side-nav{width:200px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--border);overflow-y:auto;padding:12px 8px}
.ia-nav-group-title{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:8px 8px 4px}
.ia-nav-item{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text);transition:background .12s;margin-bottom:2px}
.ia-nav-item:hover{background:var(--bg2)}
.ia-nav-item.active{background:#eff6ff;color:var(--accent);font-weight:600}
.ia-nav-item .ia-nav-tag{font-size:9px;color:var(--text2);margin-left:auto;background:var(--bg3);padding:0 6px;border-radius:8px}
.ia-panel-btn{display:block;width:100%;margin-bottom:4px;padding:6px 10px;font-family:var(--font);font-size:11px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;text-align:left;transition:all .12s}
.ia-panel-btn:hover{background:var(--bg2);border-color:var(--accent)}
.ia-panel-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ia-panel-text{font-size:10px;color:var(--text2);line-height:1.6;padding:2px 2px 8px}
.ia-panel-chip{display:inline-block;font-size:9px;background:var(--bg3);border-radius:8px;padding:0 6px;margin:0 2px 2px 0;color:var(--text2)}
.ia-stage{flex:1;display:flex;flex-direction:column;min-height:0}
.ia-stage-content{flex:1;display:flex;flex-direction:column;min-height:0}
.topbar .org-link{color:#7c3aed;text-decoration:none;font-size:12px;white-space:nowrap}

/* ═══════ [multi-domain] 组织图谱领域样式（scoped：全部限定 #orgView / #orgBar，意图领域零影响） ═══════ */
#orgView{flex:1;overflow:auto;display:none;
  --org-bg:#0f172a;--org-panel:#1e293b;--org-panel2:#273449;--org-border:#334155;
  --org-text:#e2e8f0;--org-muted:#94a3b8;--org-accent:#38bdf8;--org-primary:#2563eb;

<script>
// ══════════════ State ══════════════
var S = {
  graph:null, selNodeId:null, selEdgeIdx:null, schema:null, dirty:false, versions:[],
  g6:null, guideMode:false, guideStep:0, ctxNodeId:null, edgeSrc:null, edgeTgt:null,
  undoStack:[], redoStack:[], clipboard:null, maxUndo:50,
  startMode:'home', workStage:'structure', templateContext:null, lastValidation:null
};
var WORK_STAGES=[
  {key:'structure',label:'结构建模'},
  {key:'semantics',label:'语义补全'},
  {key:'runtime',label:'运行时绑定'},
  {key:'release',label:'治理发布'}
];
var TEMPLATE_PATTERNS=[
  {key:'query',label:'查询模式'},
  {key:'ask',label:'问答模式'},
  {key:'execution',label:'执行模式'},
  {key:'clarify',label:'澄清模式'}
];

// ══════════════ Undo/Redo System ══════════════
function saveSnapshot(){
  if(!S.graph)return;
  var snapshot=JSON.stringify(S.graph);
  S.undoStack.push(snapshot);
  if(S.undoStack.length>S.maxUndo)S.undoStack.shift();
  S.redoStack=[];
}
function undo(){
  if(S.undoStack.length===0){setBadge('warn','无撤销');return;}
  if(S.graph)S.redoStack.push(JSON.stringify(S.graph));
  var prev=S.undoStack.pop();
  S.graph=JSON.parse(prev);
  S.dirty=true;
  S.selNodeId=null;S.selEdgeIdx=null;
  renderAll();
  setBadge('ok','已撤销');
}
function redo(){
  if(S.redoStack.length===0){setBadge('warn','无重做');return;}
  if(S.graph)S.undoStack.push(JSON.stringify(S.graph));
  var next=S.redoStack.pop();
  S.graph=JSON.parse(next);
  S.dirty=true;
  S.selNodeId=null;S.selEdgeIdx=null;
  renderAll();
  setBadge('ok','已重做');
}

// ══════════════ Clipboard (Copy/Paste) ══════════════
function copyNode(){
  if(!S.selNodeId){setBadge('warn','请先选中节点');return;}
  var node=findNodeById(S.selNodeId);
  if(!node){setBadge('warn','节点不存在');return;}
  S.clipboard={node:JSON.parse(JSON.stringify(node)),type:getNodeType(node)};
  setBadge('ok','已复制');
}
function pasteNode(){
  if(!S.clipboard){setBadge('warn','剪贴板空');return;}
  if(!S.graph){setBadge('warn','请先新建图谱');return;}
  saveSnapshot();
  var copied=JSON.parse(JSON.stringify(S.clipboard.node));
  var type=S.clipboard.type;
  var idMap={intent_node:'intent_leaf_',aggregate_intent:'intent_group_node_',business_object:'obj_',action:'act_',slot:'slot_',state_constraint:'state_',risk:'risk_',knowledge_answer:'knowledge_',runtime_boundary:'rb_'};
  var newId=idMap[type]+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  if(copied.identity)copied.identity.intent_id=newId;
  else if(copied.intent_id)copied.intent_id=newId;
  else if(copied.object_id)copied.object_id=newId;
  else if(copied.action_id)copied.action_id=newId;
  else if(copied.slot_id)copied.slot_id=newId;
  else if(copied.state_id)copied.state_id=newId;
  else if(copied.risk_id)copied.risk_id=newId;
  else if(copied.knowledge_id)copied.knowledge_id=newId;
  else if(copied.runtime_boundary_id)copied.runtime_boundary_id=newId;
  if(type==='intent_node'){if(!S.graph.intent_nodes)S.graph.intent_nodes=[];S.graph.intent_nodes.push(copied);}
  else if(type==='aggregate_intent'){if(!S.graph.aggregate_intents)S.graph.aggregate_intents=[];S.graph.aggregate_intents.push(copied);}

function validateNodeRequired(node,type){
  var errors=[];
  if(type==='intent_node'){
    if(!node.identity||!node.identity.intent_id)errors.push('intent_id必填');
    if(!node.identity||!node.identity.intent_name)errors.push('intent_name必填');
    if(!node.identity||!node.identity.intent_type)errors.push('intent_type必填');
    if(!node.identity||!node.identity.domain)errors.push('domain必填');
    if(S.schema&&S.schema.intent_types&&!S.schema.intent_types.includes(node.identity.intent_type))errors.push('intent_type不在schema中:'+node.identity.intent_type);
  }else if(type==='aggregate_intent'){
    if(!node.intent_id)errors.push('intent_id必填');
    if(!node.intent_name)errors.push('intent_name必填');
    if(!node.domain)errors.push('domain必填');
  }
  return errors;
}
function validateEdgeType(src,tgt,edgeType){
  var srcNode=findNodeById(src),tgtNode=findNodeById(tgt);
  var srcType=srcNode?getNodeType(srcNode):'unknown',tgtType=tgtNode?getNodeType(tgtNode):'unknown';
  var rules={
    'has_leaf_intent':{src:'aggregate_intent',tgt:'intent_node'},
    'acts_on_object':{src:'intent_node',tgt:'business_object'},
    'uses_action':{src:'intent_node',tgt:'action'},
    'requires_slot':{src:'intent_node',tgt:'slot'},
    'has_state_constraint':{src:'intent_node',tgt:'state_constraint'},
    'has_risk_constraint':{src:'intent_node',tgt:'risk'},
    'has_knowledge_answer':{src:'intent_node',tgt:'knowledge_answer'},
    'references':{src:'intent_node',tgt:'runtime_boundary'}
  };
  var rule=rules[edgeType];
  if(rule){
    if(srcType!==rule.src)return['边类型'+edgeType+'要求源节点为'+rule.src+'，实际为'+srcType];
    if(tgtType!==rule.tgt)return['边类型'+edgeType+'要求目标节点为'+rule.tgt+'，实际为'+tgtType];
  }
  return[];
}

function buildTemplateGraph(domain, pattern){
  var version='template-'+pattern+'-'+Date.now().toString(36);
  var graph=createBlank();
  graph.meta.version=version;
  graph.meta.graph_version_id=version;
  graph.meta.graph_version_name='Intent Graph Template '+pattern;
  graph.meta.release_status='draft';
  graph.meta.graph_version_stage='p2_template_draft';
  graph.meta.template_context={domain:domain,pattern:pattern};
  var aggregateName=domain+'-'+((TEMPLATE_PATTERNS.find(function(p){return p.key===pattern;})||{}).label||'模板');
  var aggId='agg_'+Date.now().toString(36);
  var leafId1='leaf_'+Math.random().toString(36).slice(2,8);
  var leafId2='leaf_'+Math.random().toString(36).slice(2,8);
  var objId='obj_'+Math.random().toString(36).slice(2,8);
  var actionId='act_'+Math.random().toString(36).slice(2,8);
  var intentType=pattern==='execution'?'DO':pattern==='ask'?'ASK':'QUERY';
  var actionCode=pattern==='execution'?'apply':pattern==='clarify'?'guide':'query';
  graph.aggregate_intents.push({intent_id:aggId,intent_name:aggregateName,intent_level:'aggregate',domain:domain,modeling_role:'intent_candidate',semantic_definition:{user_goal:aggregateName,description:'模板骨架',scope_in:[aggregateName],scope_out:[]}});
  graph.intent_nodes.push({
    identity:{intent_id:leafId1,intent_name:aggregateName+'-主意图',intent_type:intentType,intent_level:'leaf',parent_intent_id:aggId,domain:domain,is_executable_leaf:intentType!=='ASK'&&intentType!=='HELP',is_knowledge_intent:intentType==='ASK'||intentType==='HELP'},
    semantic_definition:{user_goal:aggregateName+'主路径',description:'模板骨架 - 主路径',scope_in:[aggregateName],scope_out:[]},
    retrieval_profile:{utterance_view:[],semantic_view:[aggregateName],object_view:[],action_view:[actionCode],weights:{}},
    task_binding:intentType==='ASK'?null:{action:{action_code:actionCode,action_name:actionCode},business_object:{object_name:domain+'对象',object_type:''}},
    knowledge_binding:intentType==='ASK'?{knowledge_refs:[],answer_policy:'direct_answer'}:null,
    decision_policy:{default_decision:intentType==='ASK'?'answer':'execute',low_confidence_strategy:'keep_topk',clarify_questions:[],reject_policy:'fallback'},
    execution_binding:{route_type:intentType==='ASK'?'answer_or_entry_recommendation':'action_execution',standard_navigation_path:'',route_readiness:'draft'},
    governance:{quality_flags:['template_seed'],review_status:'draft'}
  });
  graph.intent_nodes.push({
    identity:{intent_id:leafId2,intent_name:aggregateName+'-补充意图',intent_type:'QUERY',intent_level:'leaf',parent_intent_id:aggId,domain:domain,is_executable_leaf:true,is_knowledge_intent:false},
    semantic_definition:{user_goal:aggregateName+'补充路径',description:'模板骨架 - 补充路径',scope_in:[],scope_out:[]},
    retrieval_profile:{utterance_view:[],semantic_view:[],object_view:[],action_view:['query'],weights:{}},
    task_binding:{action:{action_code:'query',action_name:'query'},business_object:{object_name:'',object_type:''}},
    decision_policy:{default_decision:'answer',low_confidence_strategy:'keep_topk',clarify_questions:[],reject_policy:'fallback'},
    execution_binding:{route_type:'answer_or_entry_recommendation',standard_navigation_path:'',route_readiness:'draft'},
    governance:{quality_flags:['template_seed'],review_status:'draft'}
  });
  graph.supporting_nodes.business_objects.push({object_id:objId,object_name:domain+'对象',object_type:''});
  graph.supporting_nodes.actions.push({action_id:actionId,action_name:actionCode,action_code:actionCode});
  graph.edges.push(
    {edge_id:'edge_'+Date.now().toString(36)+'a',from:aggId,to:leafId1,type:'has_leaf_intent',relation_category:'hierarchy',status:'active',version:version,owner:'template'},
    {edge_id:'edge_'+Date.now().toString(36)+'b',from:aggId,to:leafId2,type:'has_leaf_intent',relation_category:'hierarchy',status:'active',version:version,owner:'template'},
    {edge_id:'edge_'+Date.now().toString(36)+'c',from:leafId1,to:objId,type:'acts_on_object',relation_category:'semantic',status:'active',version:version,owner:'template'},
    {edge_id:'edge_'+Date.now().toString(36)+'d',from:leafId1,to:actionId,type:'uses_action',relation_category:'semantic',status:'active',version:version,owner:'template'}
  );
  return graph;
}

function getModelingChecks(graph){
  var report={errors:[],warnings:[],summaries:[]};
  if(!graph)return report;
  var leaves=graph.intent_nodes||[];
  var aggs=graph.aggregate_intents||[];
  report.summaries.push('聚合意图 '+aggs.length+'，叶子意图 '+leaves.length+'。');
  leaves.forEach(function(leaf){
    var id=leaf.identity||{};
    var leafName=id.intent_name||id.intent_id||'未命名叶子';
    if(!id.parent_intent_id)report.warnings.push(leafName+' 缺少父聚合意图');
    if(id.intent_type==='DO'&&!leaf.task_binding)report.errors.push(leafName+' 是 DO，但缺少 task_binding');
    if((id.intent_type==='ASK'||id.intent_type==='HELP')&&!leaf.knowledge_binding)report.warnings.push(leafName+' 是问答型，但缺少 knowledge_binding');
    if(!leaf.semantic_definition||!(leaf.semantic_definition.scope_in||[]).length)report.warnings.push(leafName+' 缺少 scope_in');
    if(!leaf.retrieval_profile||!(leaf.retrieval_profile.utterance_view||[]).length)report.warnings.push(leafName+' 缺少用户说法');
    if(!leaf.execution_binding||!leaf.execution_binding.standard_navigation_path)report.warnings.push(leafName+' 缺少标准导航路径');
  });
  return report;
}

function renderStageChecklist(){
  var report=getModelingChecks(S.graph);
  var stageLabel=(WORK_STAGES.find(function(x){return x.key===S.workStage;})||{}).label||'';
  var checks=[];
  if(S.workStage==='structure'){
    checks.push((S.graph&&((S.graph.aggregate_intents||[]).length>0)?'<span class="ok">已建立聚合骨架</span>':'<span class="err">至少需要一个聚合意图</span>'));
    checks.push((report.warnings.filter(function(x){return x.indexOf('父聚合意图')>=0;}).length===0?'<span class="ok">叶子已挂到聚合下</span>':'<span class="warn">仍有叶子未归属到聚合</span>'));
  }else if(S.workStage==='semantics'){
    checks.push((report.warnings.filter(function(x){return x.indexOf('scope_in')>=0;}).length===0?'<span class="ok">语义范围已补齐</span>':'<span class="warn">仍有语义范围缺口</span>'));
    checks.push((report.warnings.filter(function(x){return x.indexOf('用户说法')>=0;}).length===0?'<span class="ok">用户说法已补齐</span>':'<span class="warn">仍有用户说法缺口</span>'));
  }else if(S.workStage==='runtime'){
    checks.push((report.errors.length===0?'<span class="ok">运行时硬错误为 0</span>':'<span class="err">存在运行时硬错误 '+report.errors.length+' 个</span>'));
    checks.push((report.warnings.filter(function(x){return x.indexOf('标准导航路径')>=0;}).length===0?'<span class="ok">导航路径已补齐</span>':'<span class="warn">仍有导航路径缺口</span>'));
  }else if(S.workStage==='release'){
    checks.push((report.errors.length===0?'<span class="ok">可导出候选版本</span>':'<span class="err">导出前需先清理硬错误</span>'));
    checks.push((S.lastValidation&&S.lastValidation.success?'<span class="ok">最近一次服务端校验通过</span>':'<span class="warn">建议先运行服务端校验</span>'));
  }
  return '<div class="stage-card"><h4>'+esc(stageLabel)+'检查单</h4><div class="stage-check">'+checks.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div></div>';
}

function startGuidedMode(){
  S.guideMode=true; S.guideStep=0;
  if(!S.graph){S.graph=createDemo();S.dirty=false;}
  showGuideStep(0);
  renderAll();
  setBadge('warn','引导模式');
}

function showGuideStep(idx){
  S.guideStep=idx; var step=GUIDE_STEPS[idx];
  var banner=document.getElementById('guideBanner');
  banner.style.display='block';
  banner.innerHTML='<div class="gstep">🔰 引导 · 步骤 '+(idx+1)+'/'+GUIDE_STEPS.length+'</div>'+step.title;

  var html='';
  if(step.html){html+=step.html();}
  else {
    if(step.hint)html+='<div style="font-size:10px;color:var(--text2);white-space:pre-line;background:var(--bg3);padding:8px 10px;border-radius:6px;margin-bottom:8px;line-height:1.6">'+step.hint+'</div>';
    if(step.field==='name'){
      html+='<input id="guideInput" placeholder="'+esc(step.placeholder||'')+'" style="width:100%;padding:7px 10px;border:1px solid var(--accent);border-radius:6px;font-size:12px;margin-bottom:8px" onkeydown="if(event.key===\'Enter\')guideNext()">';
    }else if(step.field==='itype'){
      html+='<div style="display:flex;flex-direction:column;gap:5px;margin-bottom:8px">';
      (S.schema.intent_types||[]).forEach(function(t){
        var descs={ASK:'咨询类',QUERY:'查询类',DO:'执行类',CHANGE:'修改类',CANCEL:'取消类',HELP:'帮助类'};
        html+='<label style="display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:11px"><input type="radio" name="guideItype" value="'+t+'"><b>'+t+'</b> <span style="font-weight:400">'+(INTENT_CN[t]||'')+'</span> <span style="color:var(--text2);font-size:10px">— '+(descs[t]||'')+'</span></label>';
      });
      html+='</div>';
    }else if(step.field==='utterances'){
      html+='<textarea id="guideInput" placeholder="'+esc(step.placeholder||'')+'" style="width:100%;height:90px;padding:7px 10px;border:1px solid var(--accent);border-radius:6px;font-size:11px;margin-bottom:8px;resize:vertical"></textarea>';
    }else if(step.field==='objName'||step.field==='navPath'){
      html+='<input id="guideInput" placeholder="'+esc(step.placeholder||'')+'" style="width:100%;padding:7px 10px;border:1px solid var(--accent);border-radius:6px;font-size:12px;margin-bottom:8px" onkeydown="if(event.key===\'Enter\')guideNext()">';
    }
  }

  html+='<div style="display:flex;gap:6px;justify-content:space-between;margin-top:4px">';
  if(idx>0)html+='<button onclick="showGuideStep('+(idx-1)+')" style="padding:6px 14px;cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:11px">← 上一步</button>';
  else html+='<span></span>';
  html+='<button onclick="guideNext()" style="padding:6px 18px;cursor:pointer;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600">'+(idx===0?'开始 →':(step.action?'下一步 →':'完成 ✓'))+'</button>';
  html+='</div>';

  document.getElementById('infoContent').innerHTML=html;
}

function guideNext(){
  var step=GUIDE_STEPS[S.guideStep];
  var val=document.getElementById('guideInput')?document.getElementById('guideInput').value.trim():'';

  switch(step.action){
    case 'addAgg':if(!val){alert('请输入聚合意图名称');return;}addAggFromGuide(val);S._guideAggName=val;break;
    case 'addLeaf':if(!val){alert('请输入叶子意图名称');return;}addLeafFromGuide(val);S._guideLeafName=val;break;
    case 'setType':var sel=document.querySelector('input[name="guideItype"]:checked');if(!sel){alert('请选择意图类型');return;}S._guideItype=sel.value;applyGuideItype(sel.value);break;
    case 'addUtterances':val=document.getElementById('guideInput')?document.getElementById('guideInput').value.trim():'';applyGuideUtterances(val);break;
    case 'bindObject':val=document.getElementById('guideInput')?document.getElementById('guideInput').value.trim():'';if(val)bindGuideObject(val);break;
    case 'setNav':val=document.getElementById('guideInput')?document.getElementById('guideInput').value.trim():'';if(val)setGuideNav(val);break;
  }
  if(S.guideStep<GUIDE_STEPS.length-1){showGuideStep(S.guideStep+1);}else{switchToExpert();}
}

function addAggFromGuide(name){
  var id='intent_group_'+Date.now().toString(36);
  if(!S.graph.aggregate_intents)S.graph.aggregate_intents=[];
  S.graph.aggregate_intents.push({intent_id:id,intent_name:name,intent_level:'aggregate',domain:'账户管理',modeling_role:'intent_candidate',semantic_definition:{user_goal:name,description:'引导模式 — '+name,scope_in:[name],scope_out:[]}});
  S._guideAggId=id;S.dirty=true;renderAll();
}
function addLeafFromGuide(name){
  var id='intent_leaf_'+Date.now().toString(36),pid=S._guideAggId||'';
  if(!S.graph.intent_nodes)S.graph.intent_nodes=[];
  S.graph.intent_nodes.push({
    identity:{intent_id:id,intent_name:name,intent_type:'QUERY',intent_level:'leaf',parent_intent_id:pid,domain:'账户管理',is_executable_leaf:true,is_knowledge_intent:false},
    semantic_definition:{user_goal:name,description:'引导模式 — '+name,scope_in:[name],scope_out:[]},
    retrieval_profile:{utterance_view:[],semantic_view:[name],object_view:[],action_view:['query'],weights:{}},
    task_binding:{action:{action_code:'query',action_name:'查询'},business_object:{object_name:'',object_type:''}},
    decision_policy:{default_decision:'answer',low_confidence_strategy:'keep_topk',clarify_questions:[],reject_policy:'fallback'},
    execution_binding:{route_type:'answer',standard_navigation_path:'',route_readiness:'draft'},
    governance:{quality_flags:['guide'],review_status:'draft'}
  });
  S._guideLeafId=id;
  if(pid){if(!S.graph.edges)S.graph.edges=[];S.graph.edges.push({edge_id:'edge_g1',from:pid,to:id,type:'has_leaf_intent',relation_category:'hierarchy',status:'active',version:'guide',owner:'expert'});}
  S.dirty=true;renderAll();
}
function applyGuideItype(itype){
  var leaf=findNodeById(S._guideLeafId);if(!leaf||!leaf.identity)return;
  leaf.identity.intent_type=itype;var isKnow=itype==='ASK'||itype==='HELP';
  leaf.identity.is_executable_leaf=!isKnow;leaf.identity.is_knowledge_intent=isKnow;
  if(isKnow){leaf.knowledge_binding={knowledge_refs:[],answer_policy:'direct_answer'};leaf.task_binding=null;}
  else{leaf.task_binding={action:{action_code:itype.toLowerCase(),action_name:S._guideLeafName},business_object:{object_name:'',object_type:''}};leaf.knowledge_binding=null;}
  S.dirty=true;renderAll();
}
function applyGuideUtterances(text){
  var leaf=findNodeById(S._guideLeafId);if(!leaf||!leaf.retrieval_profile)return;
  leaf.retrieval_profile.utterance_view=text.split('\n').map(function(s){return s.trim();}).filter(Boolean);S.dirty=true;
}
function bindGuideObject(name){
  var leaf=findNodeById(S._guideLeafId);if(!leaf)return;
  var objId='obj_guide_'+Date.now().toString(36);
  if(!S.graph.supporting_nodes)S.graph.supporting_nodes={};
  if(!S.graph.supporting_nodes.business_objects)S.graph.supporting_nodes.business_objects=[];
  S.graph.supporting_nodes.business_objects.push({object_id:objId,object_name:name,object_type:''});
  if(leaf.task_binding&&leaf.task_binding.business_object)leaf.task_binding.business_object.object_name=name;
  if(!S.graph.edges)S.graph.edges=[];
  S.graph.edges.push({edge_id:'edge_go',from:S._guideLeafId,to:objId,type:'acts_on_object',relation_category:'semantic',status:'active',version:'guide',owner:'expert'});
  S.dirty=true;renderAll();
}
function setGuideNav(path){
  var leaf=findNodeById(S._guideLeafId);if(!leaf||!leaf.execution_binding)return;
  leaf.execution_binding.standard_navigation_path=path;S.dirty=true;
}
function switchToExpert(){
  S.guideMode=false;
  S.startMode='workbench';
  document.getElementById('guideBanner').style.display='none';
  renderAll();
  setBadge('ok','专家模式');
}

// ══════════════ Workspace: Intent Framework Tree ══════════════
var treeSections = {}; // sectionId → {open:bool}

function renderNodeTree(){
  if(!S.graph){
    document.getElementById('treeWrap').innerHTML='<div class="tree-empty">请选择模板起点或加载已有版本</div>';
    document.getElementById('treeStats').textContent='尚未开始建模';
    return;
  }
  var all=getAllNodes(),search=document.getElementById('tableSearch').value.toLowerCase();
  if(search)all=all.filter(function(x){return(getNodeName(x.node).toLowerCase().indexOf(search)>=0)||(getNodeId(x.node).toLowerCase().indexOf(search)>=0);});

  // Group: domain → aggregate_intents → leaf intents
  var byDomain={}, aggMap={}, leafByParent={}, orphanLeaves=[], supportingByType={};

  all.forEach(function(x){
    var n=x.node,t=x.type;
    if(t==='aggregate_intent'){
      var d=n.domain||'未分类';
      if(!byDomain[d])byDomain[d]={aggs:[],leaves:[]};
      byDomain[d].aggs.push(x);
      aggMap[getNodeId(n)]=x;
    }else if(t==='intent_node'){
      var pid=(n.identity||{}).parent_intent_id;
      if(pid&&pid!=='null'&&pid!==''){
        if(!leafByParent[pid])leafByParent[pid]=[];
        leafByParent[pid].push(x);
      }else{orphanLeaves.push(x);}
    }else{
      if(!supportingByType[t])supportingByType[t]=[];
      supportingByType[t].push(x);
    }
  });

  // Assign orphan leaves to domains based on their own domain field
  orphanLeaves.forEach(function(x){
    var d=(x.node.identity||{}).domain||'未分类';
    if(!byDomain[d])byDomain[d]={aggs:[],leaves:[]};
    byDomain[d].leaves.push(x);
  });

  var html='';
  var s=getStats();

  // ═══ L0 + L1 → L2 → L3+ (recursive, all domains visible) ═══
  // L0 root header
  html+='<div style="padding:6px 10px;font-weight:700;font-size:11px;color:var(--text);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px">';
  html+='📊 意图图谱 <span style="font-size:9px;color:var(--text2);font-weight:400">'+s.totalNodes+'节点 · '+s.edges+'边</span></div>';

  // L1: All 13 domains, collapsed if empty
  CORE_DOMAINS.forEach(function(domain,di){
    var dg=byDomain[domain]||{aggs:[],leaves:[]};
    var allAggs=dg.aggs;
    var totalLeaf=0;
    allAggs.forEach(function(ax){totalLeaf+=(leafByParent[getNodeId(ax.node)]||[]).length;});
    totalLeaf+=dg.leaves.length;
    var isEmpty=allAggs.length===0&&dg.leaves.length===0;
    var open=!isEmpty; // auto-expand domains with data

    html+='<div class="tree-dm-hd" onclick="toggleDomain(event,\'dm_'+di+'\')">';
    html+='<span class="tree-arw'+(open?' open':'')+'">▶</span>';
    html+='<span style="font-size:12px;width:16px;text-align:center">'+(isEmpty?'📭':'🏦')+'</span>';
    html+='<span class="tree-dm-name'+(isEmpty?' tree-dm-empty':'')+'">'+esc(domain)+'</span>';
    html+='<span class="tree-dm-meta">'+(isEmpty?'空':allAggs.length+'聚合 · '+totalLeaf+'叶子')+'</span>';
    html+='</div>';

    html+='<div class="tree-dm-body" id="tsec_dm_'+di+'" style="display:'+(open?'block':'none')+'">';
    if(!isEmpty){
      allAggs.forEach(function(ax,ai){
        var aggId=getNodeId(ax.node);
        var children=leafByParent[aggId]||[];
        var isLastAgg=ai===allAggs.length-1&&dg.leaves.length===0;
        html+=renderTreeNodeRecursive(ax.node,'aggregate_intent',1,children,isLastAgg);
      });
      dg.leaves.forEach(function(lx,li){
        html+=renderTreeNodeRecursive(lx.node,'intent_node',1,null,li===dg.leaves.length-1);
      });
    }
    html+='</div>';
  });

  // ── 支撑节点 ──
  var supOrder=['business_object','action','slot','state_constraint','risk','knowledge_answer','runtime_boundary'];
  var supIcons={business_object:'📦',action:'⚡',slot:'🔧',state_constraint:'🚦',risk:'⚠️',knowledge_answer:'💡',runtime_boundary:'🚫'};
  var hasSupporting=false;
  supOrder.forEach(function(t){if((supportingByType[t]||[]).length>0)hasSupporting=true;});
  if(hasSupporting){
    html+='<div class="tree-sup-hd">📦 支撑节点</div>';
    supOrder.forEach(function(t){
      var items=supportingByType[t]||[];if(items.length===0)return;
      var st=NODE_STYLE[t]||{},label=st.label||t,color=st.color||'#888';
      items.forEach(function(x){
        var n=x.node,id=getNodeId(n),name=getNodeName(n);
        html+='<div class="tree-sup-node'+(S.selNodeId===id?' active':'')+'" onclick="selectNode(\''+esc(id)+'\')">';
        html+='<span class="sup-icon">'+(supIcons[t]||'•')+'</span>';
        html+='<span class="sup-name" title="'+esc(id)+'">'+esc(name)+'</span>';
        html+='<span class="sup-type" style="background:'+color+'">'+esc(label)+'</span>';
        html+='<span class="tn-actions">';
        html+='<button onclick="event.stopPropagation();selectNode(\''+esc(id)+'\')" title="编辑">🖊</button>';
        html+='<button class="del" onclick="event.stopPropagation();if(confirm(\'删除 '+esc(name)+'?\')){deleteNode(\''+esc(id)+'\');renderAll();}" title="删除">×</button>';
        html+='</span></div>';
      });
    });
  }

  document.getElementById('treeWrap').innerHTML=html||'<div class="tree-empty">暂无节点 — 点击「+ 添加」开始</div>';

  var s=getStats();
  document.getElementById('treeStats').textContent='共 '+s.totalNodes+' 节点 · '+s.edges+' 边';
  renderLegend();
}

// Recursive tree node renderer: handles L2+ at any depth with full connector lines
// children: array of {node, type} or null
function renderTreeNodeRecursive(node, type, level, children, isLast){
  var id=getNodeId(node),name=getNodeName(node);
  var st=NODE_STYLE[type]||NODE_STYLE.intent_node,color=st.color;
  var baseIndent=10; // px per level for tree line positioning
  var lineX=baseIndent+(level-1)*18; // x position of vertical line
  var contentIndent=lineX+16; // where content starts

  var secId='tn_'+id;
  var open=treeSections[secId]!==false;
  var hasKids=children&&children.length>0;

  // Icon and label
  var icon='📄',typeLabel=st.label||type;
  if(type==='aggregate_intent'){icon='📁';typeLabel='聚合';}
  else if(type==='intent_node'){var it=(node.identity||{}).intent_type||'?';typeLabel=it+' '+(INTENT_CN[it]||'');icon='📄';}
  else if(type==='business_object'){icon='📦';}
  else if(type==='action'){icon='⚡';}
  else if(type==='slot'){icon='🔧';}
  else if(type==='state_constraint'){icon='🚦';}
  else if(type==='risk'){icon='⚠️';}
  else if(type==='knowledge_answer'){icon='💡';}
  else if(type==='runtime_boundary'){icon='🚫';}

  var html='';
  html+='<div class="tree-row'+(type==='aggregate_intent'?' tree-agg-row':'')+(S.selNodeId===id?' active':'')+'" style="padding-left:'+contentIndent+'px" onclick="treeNodeClick(event,\''+esc(id)+'\',\''+secId+'\','+hasKids+')">';

  // Vertical connector line (full height, half if last child)
  if(level>=1){
    html+='<span class="tree-lv" style="left:'+lineX+'px;'+(isLast?'bottom:50%':'')+'"></span>';
    html+='<span class="tree-lh" style="left:'+lineX+'px;width:'+(contentIndent-lineX-4)+'px"></span>';
  }

  // Expand arrow (only for nodes with children)
  if(hasKids){
    html+='<span class="tree-arw'+(open?' open':'')+'">▶</span>';
  }else{
    html+='<span style="width:14px;flex-shrink:0"></span>';
  }
  html+='<span style="font-size:12px;flex-shrink:0">'+icon+'</span>';
  html+='<span class="tree-row-name" title="'+esc(id)+'">'+esc(name)+'</span>';
  html+='<span class="tree-row-type" style="background:'+color+'">'+esc(typeLabel)+'</span>';
  html+='<span class="tree-row-actions">';
  if(type==='aggregate_intent'){
    html+='<button onclick="event.stopPropagation();addLeafUnderAgg(\''+esc(id)+'\')" title="添加子意图" style="color:var(--accent)">+子</button>';
  }
  html+='<button onclick="event.stopPropagation();selectNode(\''+esc(id)+'\')" title="编辑">🖊</button>';
  html+='<button class="del" onclick="event.stopPropagation();if(confirm(\'删除 '+esc(name)+'?\')){deleteNode(\''+esc(id)+'\');renderAll();}" title="删除">×</button>';
  html+='</span></div>';

  // Children
  if(hasKids){
    html+='<div id="tsec_'+secId+'" style="display:'+(open?'block':'none')+'">';
    // Draw continuation of parent's vertical line through child area
    children.forEach(function(cx,ci){
      html+=renderTreeNodeRecursive(cx.node,cx.type,level+1,null,ci===children.length-1);
    });
    html+='</div>';
  }

  return html;
}

// Toggle domain expand
function toggleDomain(e, secId){
  e.stopPropagation();
  var body=document.getElementById('tsec_'+secId);
  if(!body)return;
  var v=body.style.display==='none';
  body.style.display=v?'block':'none';
  var arw=e.currentTarget.querySelector('.tree-arw');
  if(arw)arw.classList.toggle('open',v);
}

// Click handler for tree nodes
function treeNodeClick(e, id, secId, hasKids){
  if(hasKids){
    // Toggle expand
    var body=document.getElementById('tsec_'+secId);
    if(body){
      var v=body.style.display==='none'||!body.style.display;
      body.style.display=v?'block':'none';
      treeSections[secId]=v;
      // Update arrow
      var row=e.currentTarget;
      var arw=row.querySelector('.tree-arw');
      if(arw)arw.classList.toggle('open',v);
    }
    e.stopPropagation();
  }
  selectNode(id);
}

function getStats(){
  var ni=S.graph?S.graph.intent_nodes||[]:[];
  var na=S.graph?S.graph.aggregate_intents||[]:[];
  var sn=S.graph?S.graph.supporting_nodes||{}:{};
  var so=0;Object.keys(sn).forEach(function(k){so+=(sn[k]||[]).length;});
  var ne=S.graph?S.graph.edges||[]:[];
  var itc={};ni.forEach(function(n){var t=(n.identity||{}).intent_type||'?';itc[t]=(itc[t]||0)+1;});
  return {totalNodes:ni.length+na.length+so,agg:na.length,leaf:ni.length,other:so,edges:ne.length,itypeCount:itc};
}

function savePropsAndRefresh(){
  if(!S.selNodeId)return;var n=findNodeById(S.selNodeId);if(!n)return;
  // Validate required fields
  var content=document.getElementById('infoContent');
  var requiredEls=content.querySelectorAll('[data-required="1"]');
  var hasError=false;
  requiredEls.forEach(function(el){
    if(!el.value.trim()){
      el.style.borderColor='var(--red)';
      el.style.background='#fff5f5';
      hasError=true;
    }else{
      el.style.borderColor='';
      el.style.background='';
    }
  });
  if(hasError){
    setBadge('err','请填写所有必填字段（标有 * 的为必填）');
    return;
  }
  var els=content.querySelectorAll('input,select,textarea');
  els.forEach(function(el){
    var id=el.id,val=el.value;if(!id)return;
    if(id==='intent_name'&&n.identity)n.identity.intent_name=val;
    else if(id==='intent_type'&&n.identity)n.identity.intent_type=val;
    else if(id==='domain'){if(n.identity)n.identity.domain=val;else n.domain=val;}
    else if(id==='parent_intent_id'&&n.identity)n.identity.parent_intent_id=val;
    else if(id==='user_goal'&&n.semantic_definition)n.semantic_definition.user_goal=val;
    else if(id==='description'&&n.semantic_definition)n.semantic_definition.description=val;
    else if(id==='route_type'&&n.execution_binding)n.execution_binding.route_type=val;
    else if(id==='nav_path'&&n.execution_binding)n.execution_binding.standard_navigation_path=val;
    else if(id==='tb_ac'&&n.task_binding&&n.task_binding.action)n.task_binding.action.action_code=val;
    else if(id==='tb_an'&&n.task_binding&&n.task_binding.action)n.task_binding.action.action_name=val;
    else if(id==='tb_on'&&n.task_binding&&n.task_binding.business_object)n.task_binding.business_object.object_name=val;
    else if(id==='node_name'&&!n.identity&&!n.intent_id)n.intent_name=val;
  });
  var arrMap={};
  content.querySelectorAll('[data-arr]').forEach(function(el){
    var key=el.getAttribute('data-arr');
    if(!arrMap[key])arrMap[key]=[];
    if(el.value.trim())arrMap[key].push(el.value.trim());
  });
  if(n.semantic_definition){
    if(arrMap.scope_in)n.semantic_definition.scope_in=arrMap.scope_in;
    if(arrMap.scope_out)n.semantic_definition.scope_out=arrMap.scope_out;
  }
  if(n.retrieval_profile){
    if(arrMap.utterance_view)n.retrieval_profile.utterance_view=arrMap.utterance_view;
    if(arrMap.object_view)n.retrieval_profile.object_view=arrMap.object_view;
    if(arrMap.action_view)n.retrieval_profile.action_view=arrMap.action_view;
  }
  S.dirty=true;renderAll();setBadge('ok','已保存');
}

// ══════════════ Edge List (card-style) ══════════════
function renderEdgesHTML(nodeId){

    html+='<div style="color:var(--text2);font-size:11px;padding:8px 0;text-align:center">暂无关联边</div>';
    html+='<div style="font-size:10px;color:var(--text2);text-align:center">在画布上拖拽节点连线 或 右键节点 → 「从此节点连边」</div>';
  }else{
    rel.forEach(function(e,i){
      var isOut=(e.from||e.source)===nodeId,other=isOut?(e.to||e.target):(e.from||e.source),otherNode=findNodeById(other);
      var globalIdx=S.graph.edges.indexOf(e);
      html+='<div class="edge-card'+(S.selEdgeIdx===globalIdx?' style="border-color:var(--accent);background:#f0f5ff"':'')+'" onclick="S.selNodeId=null;S.selEdgeIdx='+globalIdx+';selectEdge('+globalIdx+');">';
      html+='<span class="ec-dir '+(isOut?'out':'in')+'">'+(isOut?'→':'←')+'</span>';

      html+='<span class="ec-target" title="'+esc(other)+'">'+esc((getNodeName(otherNode)||other).slice(0,20))+'</span>';
      html+='<span class="ec-del" onclick="event.stopPropagation();deleteEdgeFromRel('+globalIdx+')" title="删除边">×</span>';
      html+='</div>';
    });

  html+='</div>';
  return html;
}

function deleteEdgeFromRel(idx){
  var nodeId=S.selNodeId,edges=S.graph.edges||[];
  if(idx>=0&&idx<edges.length){
    var e=edges[idx],other=(e.from||e.source)===nodeId?(e.to||e.target):(e.from||e.source);
    if(!confirm('删除此边？\n'+(EDGE_CN[e.type]||e.type)+' → '+esc(other)))return;
    edges.splice(idx,1);S.dirty=true;if(S.selEdgeIdx===idx)S.selEdgeIdx=null;
    renderAll();showNodeDetail(findNodeById(nodeId),nodeId);
  }
}

// ══════════════ G6 Canvas ══════════════
function renderG6(){
  var container=document.getElementById('g6container'),empty=document.getElementById('gcanvasEmpty');
  if(!container)return;

  if(S.g6){try{S.g6.destroy();}catch(e){}S.g6=null;S._g6events=false;}

  var allNodes=getAllNodes();
  if(!S.graph||allNodes.length===0){
    container.style.display='none';empty.style.display='flex';
    document.getElementById('zoomBar').style.display='none';
    document.getElementById('graphBadge').style.display='none';
    return;
  }
  container.style.display='block';empty.style.display='none';
  container.innerHTML='';
  if(typeof G6==='undefined'){container.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text2);font-size:12px">G6 加载中...</div>';return;}

  var g6Nodes=allNodes.map(function(x){
    var n=x.node,t=x.type,id=getNodeId(n),name=getNodeName(n);if(!id)return null;
    var st=NODE_STYLE[t]||NODE_STYLE.intent_node,color=st.color;
    if(t==='intent_node'&&n.identity&&n.identity.intent_type)color=INTENT_COLORS[n.identity.intent_type]||color;
    return {
      id:id,
      type:G6_SHAPES[st.shape]||'circle',
      data:{
        label:(name||id).slice(0,18),
        nodeType:t,
        color:color,
        size:st.size
      }
    };
  }).filter(Boolean);

  var g6Edges=(S.graph.edges||[]).map(function(e,i){
    var src=e.from||e.source,tgt=e.to||e.target;
    if(!src||!tgt)return null;
    return {id:e.edge_id||('e'+i),source:src,target:tgt,data:{label:(e.type||'').slice(0,14)}};
  }).filter(Boolean);

  try{
    S.g6=new G6.Graph({
      container:container,width:container.parentElement.clientWidth,height:container.parentElement.clientHeight,
      data:{nodes:g6Nodes,edges:g6Edges},
      layout:g6Nodes.length>0?{type:'force',preventOverlap:true,linkDistance:100,nodeSize:30}:{type:'force'},
      node:{
        type:'circle',
        style:function(d){
          var isSel=S.selNodeId===d.id;
          return{
            size:(d.data&&d.data.size)||20,
            fill:(d.data&&d.data.color)||'#1677ff',
            labelText:(d.data&&d.data.label)||d.id,
            labelFontSize:9,
            labelPlacement:'bottom',
            labelFill:isSel?'#cf1322':'#555',
            stroke:isSel?'#cf1322':'#fff',
            lineWidth:isSel?3:1,
            // Halo (glow effect) - show on hover to indicate connection point
            halo:false,
            haloFill:'rgba(37,99,235,0.15)',
            haloStroke:'#2563eb',
            haloLineWidth:3
          };
        },
        state:{
          hover:{
            stroke:'#2563eb',
            lineWidth:2,
            halo:true,
            haloFill:'rgba(37,99,235,0.25)',
            haloStroke:'#2563eb',
            haloLineWidth:4
          },
          selected:{stroke:'#cf1322',lineWidth:3}
        }
      },
      edge:{type:'line',style:function(d){
        var edges=S.graph.edges||[];
        var isSel=S.selEdgeIdx!==null&&S.selEdgeIdx>=0&&S.selEdgeIdx<edges.length&&(edges[S.selEdgeIdx].edge_id||edges[S.selEdgeIdx].id)===d.id;
        return{stroke:isSel?'#2563eb':'#bbb',lineWidth:isSel?3:1,endArrow:true,labelText:(d.data&&d.data.label)||'',labelFontSize:7,labelFill:isSel?'#2563eb':'#999',labelFontWeight:isSel?'bold':'normal'};
      }},
      behaviors:['drag-canvas','zoom-canvas','drag-element',{
        key:'create-edge-custom',
        type:'create-edge',
        trigger:'drag',
        style:{
          stroke:'#2563eb',
          strokeWidth:2,
          lineDash:[6,3],
          endArrow:true,
          // Show anchors when dragging
          sourceAnchor:{
            fill:'#2563eb',
            stroke:'#fff',
            strokeWidth:2,
            size:10,
            r:5
          },
          targetAnchor:{
            fill:'#16a34a',
            stroke:'#fff',
            strokeWidth:2,
            size:10,
            r:5
          }
        },
        onCreate:function(evt){
          var srcId=evt.source;
          var node=findNodeById(srcId);
          if(!node)return false;
          return true;
        }
      }],
      autoFit:'view',
    });
    S.g6.render();

    if(!S._g6events){
      S._g6events=true;
      S.g6.on('canvas:dblclick',function(){if(!S.guideMode)openAddNodeModal();});

      // G6 create-edge behavior: listen to aftercreateedge event
      S.g6.on('aftercreateedge',function(evt){
        var edge=evt.edge;
        if(!edge||!edge.source||!edge.target)return;
        var srcId=edge.source,tgtId=edge.target;
        // Validate and show edge type selector
        var n1=findNodeById(srcId),n2=findNodeById(tgtId);
        if(!n1||!n2){setBadge('warn','节点不存在');return;}
        var t1=getNodeType(n1),t2=getNodeType(n2);
        var candidates=suggestEdgeTypes(t1,t2);
        if(candidates.length===0){
          alert('无法连接：'+getNodeName(n1)+'（'+t1+'）和 '+getNodeName(n2)+'（'+t2+'）之间没有合适的边类型');
          // Remove the created edge
          S.g6.removeData('edge',edge.id);
          S.g6.draw();
          return;
        }
        // Remove G6's auto-created edge (we'll add our own with proper metadata)
        S.g6.removeData('edge',edge.id);
        S.g6.draw();
        // Show edge type selector
        openEdgeModalWithNodes(srcId,tgtId);
      });

      // Hover effects with tooltip hint
      S.g6.on('node:pointerenter',function(evt){
        var nodeId=evt.target.id;
        S.g6.setElementState(nodeId,{hover:true});
        S.g6.draw();
        setBadge('warn','拖拽节点连线');
      });
      S.g6.on('node:pointerleave',function(evt){
        var nodeId=evt.target.id;
        S.g6.setElementState(nodeId,{hover:false});
        S.g6.draw();
        setBadge('ok','就绪');
      });

      // Node/Edge/Canvas interaction
      S.g6.on('node:click',function(evt){
        if(S.selEdgeIdx!==null){S.selEdgeIdx=null;highlightSelectedEdge();}
        S.selNodeId=evt.target.id;selectNode(S.selNodeId);
        setBadge('ok','已选中');
      });
      S.g6.on('canvas:click',function(evt){
        if(S.selNodeId||S.selEdgeIdx!==null){
          S.selNodeId=null;S.selEdgeIdx=null;
          renderNodeTree();renderG6();
          document.getElementById('infoContent').innerHTML='<div class="info-empty"><div class="icon">👈</div>点击节点或边<br>查看和编辑属性</div>';
          setBadge('ok','已取消选择');
        }
      });
      function ctxPos(evt){return{x:evt.clientX||(evt.client?evt.client.x:0)||(evt.canvas?evt.canvas.x:0)||0,y:evt.clientY||(evt.client?evt.client.y:0)||(evt.canvas?evt.canvas.y:0)||0};}
      S.g6.on('node:contextmenu',function(evt){if(evt.preventDefault)evt.preventDefault();if(evt.stopPropagation)evt.stopPropagation();S.ctxNodeId=evt.target.id;var p=ctxPos(evt);showCtxMenu(p.x,p.y,'node');});
      S.g6.on('canvas:contextmenu',function(evt){if(evt.preventDefault)evt.preventDefault();if(evt.stopPropagation)evt.stopPropagation();S.ctxNodeId=null;var p=ctxPos(evt);showCtxMenu(p.x,p.y,'canvas');});
      S.g6.on('edge:click',function(evt){
        var eid=evt.target.id;if(!eid)return;
        S.selNodeId=null;S.selEdgeIdx=findEdgeIdx(eid);
        selectEdge(S.selEdgeIdx);
      });
      S.g6.on('edge:contextmenu',function(evt){
        if(evt.preventDefault)evt.preventDefault();if(evt.stopPropagation)evt.stopPropagation();
        S.ctxNodeId=evt.target.id;var p=ctxPos(evt);showCtxMenu(p.x,p.y,'edge');
      });
      document.addEventListener('keydown',function(e){
        if(window.DOMAIN&&DOMAIN.current!=='intent')return; // [multi-domain hook] org 领域禁用意图快捷键
        if(e.key==='Delete'&&S.selNodeId&&document.activeElement===document.body){
          e.preventDefault();var n=findNodeById(S.selNodeId);
          if(confirm('删除 '+getNodeName(n)+'？')){deleteNode(S.selNodeId);S.selNodeId=null;renderAll();}
        }
        if(e.ctrlKey&&!e.shiftKey&&e.key==='c'){copyNode();}
        if(e.ctrlKey&&!e.shiftKey&&e.key==='v'){pasteNode();}
        if(e.ctrlKey&&!e.shiftKey&&e.key==='z'){undo();}
        if(e.ctrlKey&&e.shiftKey&&e.key==='Z'){redo();}
      });
    }
    updateCanvasHint();
    // Show zoom controls & graph badge
    document.getElementById('zoomBar').style.display='flex';
    var s=getStats();document.getElementById('graphBadge').style.display='block';
    document.getElementById('graphBadge').textContent='节点 '+s.totalNodes+' · 边 '+s.edges;
    updateZoomBadge();
    if(S.selEdgeIdx!==null)highlightSelectedEdge();
  }catch(e){container.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--red);font-size:11px">渲染失败: '+esc(e.message)+'</div>';}
}

function highlightSelectedNode(){

    var allNodes=getAllNodes();

function updateCanvasHint(){

// ══════════════ Context Menu (dynamic, type-sensitive) ══════════════
function showCtxMenu(x,y,target){
  var menu=document.getElementById('ctxMenu');
  var items=[];
  if(target==='node'){
    var n=findNodeById(S.ctxNodeId),t=getNodeType(n),name=getNodeName(n);
    items.push({label:'✏️ 编辑属性',cls:'',action:function(){hideCtxMenu();S.selNodeId=S.ctxNodeId;selectNode(S.ctxNodeId);}});
    if(t==='aggregate_intent'){
      items.push({label:'➕ 添加子意图',cls:'',action:function(){hideCtxMenu();openAddNodeModalForParent(S.ctxNodeId);}});
    }
    items.push({label:'—',cls:'ctx-div',action:null});
    items.push({label:'🗑 删除节点「'+esc(name).slice(0,10)+'」',cls:'danger',action:function(){hideCtxMenu();if(confirm('删除 '+getNodeName(findNodeById(S.ctxNodeId))+'？')){deleteNode(S.ctxNodeId);if(S.selNodeId===S.ctxNodeId)S.selNodeId=null;renderAll();}}});
  }else if(target==='edge'){
    var ei=findEdgeIdx(S.ctxNodeId),e=S.graph.edges&&ei>=0?S.graph.edges[ei]:null;
    var eDesc=e?(EDGE_CN[e.type]||e.type)+'  '+(e.from||e.source)+' → '+(e.to||e.target):'';
    items.push({label:'✏️ 编辑边属性',cls:'',action:function(){hideCtxMenu();S.selNodeId=null;S.selEdgeIdx=ei;selectEdge(ei);}});
    items.push({label:'—',cls:'ctx-div',action:null});
    items.push({label:'🗑 删除边「'+esc(eDesc.slice(0,24))+'」',cls:'danger',action:function(){hideCtxMenu();if(ei>=0&&confirm('确认删除此边？')){S.graph.edges.splice(ei,1);S.dirty=true;renderAll();}}});
  }else{
    items.push({label:'➕ 在此添加节点',cls:'',action:function(){hideCtxMenu();openAddNodeModal();}});
    items.push({label:'📊 适配画布',cls:'',action:function(){hideCtxMenu();fitCanvas();}});
  }

  var html='',idx=0;
  items.forEach(function(it){
    if(it.label==='—'){html+='<div class="ctx-div"></div>';return;}
    var fnName='_ctxFn'+idx;
    window[fnName]=it.action||function(){};
    html+='<div class="ctx-item'+(it.cls?' '+it.cls:'')+'" onclick="window.'+fnName+'();">'+it.label+'</div>';
    idx++;
  });
  menu.innerHTML=html;

  // Position within viewport
  var mw=menu.offsetWidth||180,mh=menu.offsetHeight||200;
  if(x+mw>window.innerWidth)x=window.innerWidth-mw-5;
  if(y+mh>window.innerHeight)y=window.innerHeight-mh-5;
  menu.style.display='block';menu.style.left=x+'px';menu.style.top=y+'px';
  // Ignore clicks for 300ms after opening (the right-click mouseup fires a click)
  var openTime=Date.now();
  if(S._ctxHideFn)document.removeEventListener('click',S._ctxHideFn);
  S._ctxHideFn=function(e){
    if(Date.now()-openTime<300)return;
    hideCtxMenu();
    document.removeEventListener('click',S._ctxHideFn);
    S._ctxHideFn=null;
  };
  setTimeout(function(){document.addEventListener('click',S._ctxHideFn);},0);
}
function hideCtxMenu(){document.getElementById('ctxMenu').style.display='none';S.ctxNodeId=null;if(S._ctxHideFn){document.removeEventListener('click',S._ctxHideFn);S._ctxHideFn=null;}}

// Open edge modal with source and target node IDs (from Shift+drag)

// ═══ Smart edge connection with auto-type detection ═══
function smartConnect(srcId,tgtId){
  var n1=findNodeById(srcId),n2=findNodeById(tgtId);
  if(!n1||!n2)return;
  var t1=getNodeType(n1),t2=getNodeType(n2);
  var candidates=suggestEdgeTypes(t1,t2);
  if(candidates.length===0){
    alert('无法连接：'+getNodeName(n1)+'（'+t1+'）和 '+getNodeName(n2)+'（'+t2+'）之间没有合适的边类型');
    return;
  }
  if(candidates.length===1){
    // Auto-create with the single best type
    addEdge(srcId,tgtId,candidates[0]);
    setBadge('ok','已添加边: '+candidates[0]);
  }else{
    // Multiple options: ask user
    S.edgeSrc=srcId;S.edgeTgt=tgtId;
    document.getElementById('edgeFromLabel').textContent=getNodeName(n1)||srcId;
    document.getElementById('edgeToLabel').textContent=getNodeName(n2)||tgtId;
    // Pre-select the first (best) candidate
    var sel=document.getElementById('newEdgeType');
    sel.innerHTML=candidates.map(function(c){return'<option>'+c+'</option>';}).join('');
    document.getElementById('addEdgeModal').classList.add('show');
  }
}

// Suggest valid edge types between two node types
function suggestEdgeTypes(t1,t2){
  var rules={
    'aggregate_intent->intent_node':['has_leaf_intent'],
    'intent_node->business_object':['acts_on_object','has_business_object'],
    'intent_node->action':['uses_action'],
    'intent_node->slot':['requires_slot','optional_slot'],
    'intent_node->state_constraint':['has_state_constraint'],
    'intent_node->risk':['has_risk_constraint'],
    'intent_node->knowledge_answer':['has_knowledge_answer'],
    'intent_node->runtime_boundary':['references'],
    'aggregate_intent->aggregate_intent':['related_to'],
    'intent_node->intent_node':['confusable_with','related_to','clarify_to'],
    'business_object->intent_node':['acts_on_object'],
    'action->intent_node':['uses_action'],
  };
  var key=t1+'->'+t2;
  return rules[key]||['related_to']; // fallback: generic relation
}

function addEdge(src,tgt,type){
  saveSnapshot();
  var errors=validateEdgeType(src,tgt,type);
  if(errors.length>0){alert(errors.join('\n'));return;}
  if(!S.graph.edges)S.graph.edges=[];
  // Check for duplicate
  var dup=S.graph.edges.some(function(e){return ((e.from||e.source)===src&&(e.to||e.target)===tgt&&e.type===type);});
  if(dup){setBadge('warn','边已存在，跳过');return;}
  S.graph.edges.push({edge_id:'edge_'+Date.now().toString(36),from:src,to:tgt,type:type,relation_category:'hierarchy',status:'active',version:'v2.1-p2-manual',owner:'expert',weight:1,priority:100});
  S.dirty=true;
  renderAll();
}
