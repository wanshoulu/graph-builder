<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="40" y="38" font-size="19" font-weight="700" fill="#0F172A">分类树全景（示例）· id 前缀逐级扩展，父 id 是子 id 的前缀</text>
  <text x="40" y="60" font-size="12" fill="#64748B">账户管理/转账服务领域直挂功能节点（简单业务）；财富管理四级（复杂业务）——两种挂法都合法</text>

  <!-- root -->
  <rect x="500" y="86" width="200" height="50" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/>
  <text x="600" y="108" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F172A">xx.root · XX银行</text>
  <text x="600" y="126" text-anchor="middle" font-size="9" fill="#64748B">根节点</text>

  <path d="M600,136 V158 H140 V182" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M600,136 V158 H450 V182" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M600,136 V158 H760 V182" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M600,136 V158 H1060 V182" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- domains -->
  <rect x="40" y="186" width="200" height="52" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="140" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">xx.account 账户管理</text>
  <text x="140" y="226" text-anchor="middle" font-size="9" fill="#1D4ED8">领域 · 直挂功能节点</text>
  <rect x="350" y="186" width="200" height="52" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="450" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">xx.transfer 转账服务</text>
  <text x="450" y="226" text-anchor="middle" font-size="9" fill="#1D4ED8">领域 · 直挂功能节点</text>
  <rect x="660" y="186" width="200" height="52" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="760" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">xx.investment 财富管理</text>
  <text x="760" y="226" text-anchor="middle" font-size="9" fill="#1D4ED8">领域 · 深层级</text>
  <rect x="960" y="186" width="200" height="52" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="1060" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">xx.credit-card 信用卡</text>
  <text x="1060" y="226" text-anchor="middle" font-size="9" fill="#1D4ED8">领域</text>

  <!-- 账户管理功能节点 -->
  <path d="M100,238 V262 H60 V280" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M140,238 V280" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M180,238 V262 H220 V280" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="30" y="284" width="130" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="95" y="302" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350F">余额查询</text>
  <text x="95" y="319" text-anchor="middle" font-size="7.5" fill="#92400E">account.balance.query</text>
  <rect x="170" y="284" width="130" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="235" y="302" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350F">交易明细查询</text>
  <text x="235" y="319" text-anchor="middle" font-size="7.5" fill="#92400E">account.detail.query</text>
  <rect x="30" y="336" width="130" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="95" y="354" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350F">银行卡挂失</text>
  <text x="95" y="371" text-anchor="middle" font-size="7.5" fill="#92400E">account.card.loss</text>

  <!-- 转账功能节点 -->
  <path d="M410,238 V262 H380 V280" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M490,238 V262 H520 V280" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="330" y="284" width="130" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="395" y="302" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350F">行内转账</text>
  <text x="395" y="319" text-anchor="middle" font-size="7.5" fill="#92400E">transfer.self.create</text>
  <rect x="470" y="284" width="140" height="44" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="540" y="302" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350F">手机号转账</text>
  <text x="540" y="319" text-anchor="middle" font-size="7.5" fill="#92400E">transfer.mobile.create</text>

  <!-- 财富管理：理财→基金→功能节点 -->
  <path d="M760,238 V262 H640 V286" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="560" y="290" width="160" height="48" rx="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.8"/>
  <text x="640" y="310" text-anchor="middle" font-size="10.5" font-weight="700" fill="#134E4A">xx.investment.wealth 理财</text>
  <text x="640" y="328" text-anchor="middle" font-size="8.5" fill="#0F766E">一级分类</text>
  <path d="M640,338 V356 H700 V374" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="640" y="378" width="180" height="48" rx="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.8"/>
  <text x="730" y="398" text-anchor="middle" font-size="10.5" font-weight="700" fill="#134E4A">xx.investment.fund 基金</text>
  <text x="730" y="416" text-anchor="middle" font-size="8.5" fill="#0F766E">二级分类（可继续往下）</text>

  <path d="M700,426 V444 H560 V462" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M730,426 V462" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M770,426 V444 H880 V462" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="470" y="466" width="180" height="48" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="560" y="486" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350F">开通基金定投</text>
  <text x="560" y="504" text-anchor="middle" font-size="7.5" fill="#92400E">fund.subscription.create</text>
  <rect x="660" y="466" width="180" height="48" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="750" y="486" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350F">修改定投计划</text>
  <text x="750" y="504" text-anchor="middle" font-size="7.5" fill="#92400E">fund.subscription.modify</text>
  <rect x="850" y="466" width="180" height="48" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="940" y="486" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350F">查定投记录</text>
  <text x="940" y="504" text-anchor="middle" font-size="7.5" fill="#92400E">fund.subscription.query</text>
  <!-- 理财直挂功能节点：基金购买 -->
  <path d="M640,338 V356 H620 V440 H610 V462" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="655" y="530" font-size="9" fill="#64748B">（理财下还可直挂功能节点如基金购买 fund.purchase.create）</text>

  <!-- 信用卡：账单分期分类+功能节点 -->
  <path d="M1060,238 V262 H1060 V280" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="980" y="284" width="170" height="48" rx="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.8"/>
  <text x="1065" y="304" text-anchor="middle" font-size="10.5" font-weight="700" fill="#134E4A">credit-card.bill 账单分期</text>
  <text x="1065" y="322" text-anchor="middle" font-size="8.5" fill="#0F766E">一级分类</text>
  <path d="M1030,332 V350 H1010 V366" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M1100,332 V350 H1120 V366" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="930" y="370" width="160" height="46" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1010" y="389" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350F">账单分期办理</text>
  <text x="1010" y="406" text-anchor="middle" font-size="7.5" fill="#92400E">bill.installment.create</text>
  <rect x="1100" y="370" width="170" height="46" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1185" y="389" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350F">分期规则咨询</text>
  <text x="1185" y="406" text-anchor="middle" font-size="7.5" fill="#92400E">bill.installment.ask</text>

  <!-- 配比提示 -->
  <rect x="330" y="430" width="200" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <text x="430" y="452" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">规模配比参考</text>
  <text x="430" y="472" text-anchor="middle" font-size="9" fill="#78350F">功能节点意图 : 功能组 ≈ 3 : 1</text>
  <text x="430" y="490" text-anchor="middle" font-size="9" fill="#78350F">（V2 实测 96 菜单 → 304 意图）</text>
  <text x="430" y="510" text-anchor="middle" font-size="9" fill="#78350F">单分类直挂功能节点建议 ≤ 12</text>
  <text x="430" y="528" text-anchor="middle" font-size="9" fill="#78350F">深度不设上限</text>
</svg>
