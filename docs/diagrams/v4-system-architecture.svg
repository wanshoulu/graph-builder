<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="40" y="38" font-size="19" font-weight="700" fill="#0F172A">意图图谱系统总架构 · 离线生产 → 版本化数据 → 运行时识别 → 业务执行 → 评测回流</text>
  <text x="40" y="60" font-size="12" fill="#64748B">生产与运行完全隔离：校验不过不发布；数据文件 digest 绑定，改图不改码</text>

  <!-- ══ 带1：离线生产 ══ -->
  <rect x="40" y="86" width="700" height="128" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="60" y="110" font-size="12" font-weight="700" fill="#92400E">① 离线生产（不碰线上）</text>
  <rect x="60" y="122" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="135" y="148" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350F">业务盘点</text>
  <text x="135" y="168" text-anchor="middle" font-size="9.5" fill="#92400E">菜单全层级/FAQ</text>
  <text x="135" y="184" text-anchor="middle" font-size="9.5" fill="#92400E">能力/策略清单</text>
  <line x1="210" y1="158" x2="240" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="244" y="122" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="319" y="148" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350F">构建器</text>
  <text x="319" y="168" text-anchor="middle" font-size="9.5" fill="#92400E">生成树骨架 root/</text>
  <text x="319" y="184" text-anchor="middle" font-size="9.5" fill="#92400E">domain/category/leaf</text>
  <line x1="394" y1="158" x2="424" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="428" y="122" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="503" y="148" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350F">别名生成（LLM）</text>
  <text x="503" y="168" text-anchor="middle" font-size="9.5" fill="#92400E">8 意图/批 × 16 条</text>
  <text x="503" y="184" text-anchor="middle" font-size="9.5" fill="#92400E">词群家族+操作家族</text>
  <line x1="578" y1="158" x2="608" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="612" y="122" width="116" height="72" rx="8" fill="#FFFFFF" stroke="#F87171"/>
  <text x="670" y="148" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7F1D1D">校验器</text>
  <text x="670" y="168" text-anchor="middle" font-size="9.5" fill="#7F1D1D">12 条硬规则</text>
  <text x="670" y="184" text-anchor="middle" font-size="9.5" fill="#7F1D1D">0 错误才放行</text>

  <!-- ══ 带2：版本化数据 ══ -->
  <rect x="40" y="240" width="1120" height="110" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/>
  <text x="60" y="264" font-size="12" font-weight="700" fill="#0C4A6E">② 版本化数据资产（纯 JSON 文件，SHA256 digest 绑定）</text>
  <rect x="60" y="278" width="340" height="56" rx="8" fill="#FFFFFF" stroke="#7DD3FC"/>
  <text x="230" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#0C4A6E">意图图谱文件 intentTree</text>
  <text x="230" y="320" text-anchor="middle" font-size="9.5" fill="#0369A1">一棵意图分类树 + relations 横切关系</text>
  <rect x="420" y="278" width="330" height="56" rx="8" fill="#FFFFFF" stroke="#7DD3FC"/>
  <text x="585" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#0C4A6E">资源注册表 Registries</text>
  <text x="585" y="320" text-anchor="middle" font-size="9.5" fill="#0369A1">能力(5种kind)/FAQ/策略 · 被有场景的节点 bindings 引用</text>
  <rect x="770" y="278" width="370" height="56" rx="8" fill="#FFFFFF" stroke="#7DD3FC"/>
  <text x="955" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#0C4A6E">语义索引缓存（digest 绑定）</text>
  <text x="955" y="320" text-anchor="middle" font-size="9.5" fill="#0369A1">图一变缓存自动失效重建 · 启动预热</text>

  <!-- 发布箭头 -->
  <path d="M670,194 V236" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text x="686" y="222" font-size="9.5" fill="#047857">发布：写文件 + 重算 digest</text>

  <!-- ══ 带3：运行时 ══ -->
  <rect x="40" y="378" width="1120" height="128" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="60" y="402" font-size="12" font-weight="700" fill="#312E81">③ 运行时识别引擎（Python :18120 · 图数据冻结加载 + digest 校验）</text>
  <rect x="60" y="414" width="200" height="76" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="160" y="438" text-anchor="middle" font-size="11.5" font-weight="700" fill="#312E81">权威通道 · 词法召回</text>
  <text x="160" y="458" text-anchor="middle" font-size="9.5" fill="#475569">别名 110 / 词组 100 / 词 90</text>
  <text x="160" y="476" text-anchor="middle" font-size="9.5" fill="#B91C1C">负例 −160 强压制</text>
  <rect x="280" y="414" width="200" height="76" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="380" y="438" text-anchor="middle" font-size="11.5" font-weight="700" fill="#134E4A">advisory通道 · 语义召回</text>
  <text x="380" y="458" text-anchor="middle" font-size="9.5" fill="#475569">排名赋分 108/104/100/96</text>
  <text x="380" y="476" text-anchor="middle" font-size="9.5" fill="#475569">阈值 0.55 · 只管换说法</text>
  <rect x="500" y="414" width="200" height="76" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="600" y="438" text-anchor="middle" font-size="11.5" font-weight="700" fill="#312E81">权威通道 · 图谱扩召</text>
  <text x="600" y="458" text-anchor="middle" font-size="9.5" fill="#475569">种子分×边权重 · 封顶 80</text>
  <text x="600" y="476" text-anchor="middle" font-size="9.5" fill="#475569">offers.65 / 同业务对象.60 / 同能力.55</text>
  <rect x="720" y="414" width="180" height="76" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text x="810" y="438" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4C1D95">裁判模型</text>
  <text x="810" y="458" text-anchor="middle" font-size="9.5" fill="#4C1D95">通常 3~8 候选内裁决</text>
  <text x="810" y="476" text-anchor="middle" font-size="9.5" fill="#4C1D95">图外意图选不出来</text>
  <rect x="920" y="414" width="220" height="76" rx="8" fill="#ECFDF5" stroke="#059669"/>
  <text x="1030" y="438" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065F46">槽位澄清 → 分级执行</text>
  <text x="1030" y="458" text-anchor="middle" font-size="9.5" fill="#047857">read-execute 直连 / confirm 确认</text>
  <text x="1030" y="476" text-anchor="middle" font-size="9.5" fill="#047857">能力网关默认拒绝</text>
  <path d="M160,350 V370 H160 V408" fill="none" stroke="#0284C7" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="178" y="372" font-size="9.5" fill="#0369A1">启动加载+摘要校验</text>
  <path d="M955,334 V370 H955 V408" fill="none" stroke="#0284C7" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrs)"/>
  <text x="972" y="372" font-size="9.5" fill="#0369A1">预热</text>
  <!-- ══ 带4：业务执行 + 评测 ══ -->
  <rect x="40" y="530" width="700" height="76" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="60" y="554" font-size="12" font-weight="700" fill="#065F46">④ 业务执行（按能力 kind 路由）</text>
  <text x="60" y="576" font-size="9.5" fill="#047857">mcp-tool 调接口 · skill 技能 · workflow 流程 · agent 智能体 · menu-nav 页面直达</text>
  <text x="60" y="594" font-size="9.5" fill="#047857">写操作（riskLevel≥L2）走挑战-确认-执行：HMAC 令牌 · 一次性挑战 · 幂等 · 双分录</text>
  <path d="M1030,490 V508 H390 V526" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrg)"/>
  <rect x="770" y="530" width="390" height="76" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="790" y="554" font-size="12" font-weight="700" fill="#334155">⑤ 评测旁路（同引擎 · badcase 回流）</text>
  <text x="790" y="576" font-size="9.5" fill="#475569">单轮确定性阶梯 + 多轮复用生产三件套</text>
  <text x="790" y="594" font-size="9.5" fill="#475569">错误 → 加别名/负例修正图谱 → 回归</text>
  <path d="M965,530 V514 H503 V212" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrs)"/>
  <text x="712" y="508" font-size="9.5" fill="#64748B">badcase 修正（改图不改码）</text>

  <text x="40" y="632" font-size="11" fill="#64748B">实线＝权威主链路　　虚线＝补位/回流通道　　黄色区＝离线生产　蓝色区＝数据资产　紫蓝区＝运行时　绿色区＝执行与评测</text>
</svg>
