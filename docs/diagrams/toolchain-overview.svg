<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1677FF"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#0F172A">总体定位 · 多入口建图 × 模板驱动校验的知识图谱构建工具链</text>
  <text x="40" y="62" font-size="12" fill="#64748B">graph-builder ｜ Excel / 文档 / 表格 / 对话 / 种子 / v2.1 迁移 六条入口进，同一道模板校验门出——结构合法、可审计、可回滚</text>

  <!-- ① 输入侧 -->
  <rect x="40" y="96" width="300" height="380" rx="14" fill="#EFF6FF" stroke="#1677FF" stroke-width="2"/>
  <text x="64" y="126" font-size="13.5" font-weight="700" fill="#1E40AF">① 建图 · 多入口摄入</text>
  <text x="64" y="145" font-size="10.5" fill="#64748B">routes/knowledge-intake.js ｜ 业务人员主力入口</text>
  <rect x="64" y="162" width="252" height="54" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="190" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Excel 三工作表导入</text>
  <text x="190" y="203" text-anchor="middle" font-size="10" fill="#64748B">功能分类 / 意图清单 / 说法库</text>
  <rect x="64" y="228" width="252" height="54" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="190" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">候选批次 + 行级校验</text>
  <text x="190" y="269" text-anchor="middle" font-size="10" fill="#64748B">枚举 / 路径父子 / 重复 / 描述长度</text>
  <rect x="64" y="294" width="252" height="54" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="190" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">人工评审 + AI 辅助</text>
  <text x="190" y="335" text-anchor="middle" font-size="10" fill="#64748B">approve / reject ｜ 骨架映射 · 扩问</text>
  <rect x="64" y="360" width="252" height="54" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="190" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">其他入口（同一套门）</text>
  <text x="190" y="401" text-anchor="middle" font-size="10" fill="#64748B">文档抽取 · 表格映射 · 对话建图 · 种子 · v2.1 迁移</text>
  <rect x="64" y="426" width="252" height="34" rx="8" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="190" y="448" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E3A8A">前端：OntoMind SPA（Knowledge_builder 仓）</text>

  <!-- ② 校验门（中心） -->
  <rect x="420" y="96" width="330" height="380" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="444" y="126" font-size="13.5" font-weight="700" fill="#9A3412">② 模板驱动校验 · 唯一的门</text>
  <text x="444" y="145" font-size="10.5" fill="#64748B">x6-graph-template-validator ｜ 所有写入路径共用</text>
  <rect x="444" y="162" width="282" height="58" rx="8" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="585" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">① 骨架校验</text>
  <text x="585" y="202" text-anchor="middle" font-size="10" fill="#64748B">ID 唯一 · 类型白名单 · 无孤儿边 · 无自环</text>
  <line x1="585" y1="220" x2="585" y2="240" stroke="#EA580C" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <rect x="444" y="244" width="282" height="58" rx="8" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="585" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">② 字段校验</text>
  <text x="585" y="284" text-anchor="middle" font-size="10" fill="#64748B">必填 · 类型 · 枚举 · 禁模板外字段</text>
  <line x1="585" y1="302" x2="585" y2="322" stroke="#EA580C" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <rect x="444" y="326" width="282" height="58" rx="8" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="585" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">③ 条件必填（10 条规则）</text>
  <text x="585" y="366" text-anchor="middle" font-size="10" fill="#64748B">answer→答案文本 · confirm→确认提示 …</text>
  <rect x="444" y="400" width="282" height="60" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
  <text x="585" y="422" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3412">规则声明在模板 JSON，不写死在代码</text>
  <text x="585" y="440" text-anchor="middle" font-size="10" fill="#9A3412">模板三合一：schema + 规则 + 种子图</text>
  <text x="585" y="474" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9A3412">不合法数据无旁路可入图</text>

  <!-- ③ 图谱存储 -->
  <rect x="820" y="96" width="340" height="380" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="844" y="126" font-size="13.5" font-weight="700" fill="#166534">③ 用图 · 图谱资产管理</text>
  <text x="844" y="145" font-size="10.5" fill="#64748B">routes/org-graph.js ｜ data/graphs/org/</text>
  <rect x="844" y="162" width="292" height="54" rx="8" fill="#FFFFFF" stroke="#BBF7D0"/>
  <text x="990" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">草稿（工作副本）</text>
  <text x="990" y="203" text-anchor="middle" font-size="10" fill="#64748B">preview-apply 先看结果 · apply 自动快照</text>
  <rect x="844" y="228" width="292" height="54" rx="8" fill="#FFFFFF" stroke="#BBF7D0"/>
  <text x="990" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">回滚（节点级精确）</text>
  <text x="990" y="269" text-anchor="middle" font-size="10" fill="#64748B">实测 358→354 节点、849 边分毫不差</text>
  <rect x="844" y="294" width="292" height="54" rx="8" fill="#FFFFFF" stroke="#BBF7D0"/>
  <text x="990" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">发布版本链 v1→v2→…</text>
  <text x="990" y="335" text-anchor="middle" font-size="10" fill="#64748B">只读快照 · activeVersion 指针 · 可选审批</text>
  <rect x="844" y="360" width="292" height="54" rx="8" fill="#FFFFFF" stroke="#BBF7D0"/>
  <text x="990" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">质量审计 + 意图试算</text>
  <text x="990" y="401" text-anchor="middle" font-size="10" fill="#64748B">确定性规则 + LLM 语义 ｜ mock 清单逼替换</text>
  <rect x="844" y="426" width="292" height="34" rx="8" fill="#DCFCE7" stroke="#86EFAC"/>
  <text x="990" y="448" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">下游：识别引擎 / 问答 / 评测（消费图谱）</text>

  <!-- 数据流箭头 -->
  <line x1="340" y1="250" x2="416" y2="250" stroke="#1677FF" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <text x="378" y="238" text-anchor="middle" font-size="10" fill="#1677FF">候选行</text>
  <line x1="750" y1="250" x2="816" y2="250" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <text x="783" y="238" text-anchor="middle" font-size="10" fill="#16A34A">valid:true</text>
  <path d="M 816 420 C 760 560, 480 560, 420 420" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="618" y="548" text-anchor="middle" font-size="10.5" font-weight="700" fill="#DC2626">valid:false 阻断（服务端强制，不信任前端）——错误明细逐条返回，改完重试</text>

  <!-- 底部：契约回归锁 -->
  <rect x="40" y="576" width="1120" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="64" y="598" font-size="11" font-weight="700" fill="#334155">契约回归锁：tests/knowledge-intake-contract.test.js 双向锁定 —— 合入产物必须 0 校验错误（防改坏）；旧版漂移输出必须仍然报错（防放宽）</text>
  <text x="64" y="613" font-size="10" fill="#64748B">127 个测试全绿 ｜ E2E 已验证：import → review → preview-apply(valid:true) → apply(354→358) → rollback(354/849)</text>
</svg>
