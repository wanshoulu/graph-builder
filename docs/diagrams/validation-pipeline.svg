<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#0F172A">模板驱动校验 · 三段管线（所有写入路径的唯一守门人）</text>
  <text x="40" y="62" font-size="12" fill="#64748B">validateGraph(template, graph) ｜ 参数顺序 template 在前（易错点）｜ 手工保存 / 批次合入 / AI 抽取 / 格式转换 / 发布 全走这一个校验器</text>

  <!-- 输入 -->
  <rect x="40" y="96" width="240" height="120" rx="12" fill="#EFF6FF" stroke="#1677FF" stroke-width="1.8"/>
  <text x="160" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E40AF">graph（待校验图谱）</text>
  <rect x="60" y="136" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="160" y="156" text-anchor="middle" font-size="10" fill="#334155">草稿 · 合入副本 · 抽取产物 · 转换产物</text>
  <rect x="60" y="172" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="160" y="192" text-anchor="middle" font-size="10" fill="#334155">任何写入路径的中间态</text>
  <line x1="280" y1="156" x2="326" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 模板 -->
  <rect x="40" y="260" width="240" height="170" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.8"/>
  <text x="160" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">template（模板）</text>
  <rect x="60" y="300" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="160" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">schema：9 种节点 / 21 种边</text>
  <text x="160" y="328" text-anchor="middle" font-size="9" fill="#64748B">各类型 properties 字段契约</text>
  <rect x="60" y="340" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="160" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">条件规则：10 条声明在 metadata</text>
  <text x="160" y="368" text-anchor="middle" font-size="9" fill="#64748B">改规则 = 改模板 JSON，不碰代码</text>
  <rect x="60" y="380" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="160" y="394" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">种子图：355 节点起步</text>
  <text x="160" y="408" text-anchor="middle" font-size="9" fill="#64748B">intent-graph.json（795KB 三合一）</text>
  <line x1="280" y1="345" x2="326" y2="290" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 三段管线 -->
  <rect x="330" y="96" width="830" height="334" rx="14" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="354" y="124" font-size="13" font-weight="700" fill="#334155">x6-graph-template-validator.js · 三段管线</text>

  <!-- 段1 -->
  <rect x="354" y="142" width="780" height="76" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="378" y="166" font-size="12" font-weight="700" fill="#312E81">① 骨架校验（skeleton）</text>
  <rect x="378" y="176" width="170" height="30" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="463" y="196" text-anchor="middle" font-size="10" fill="#334155">节点 ID 唯一</text>
  <rect x="560" y="176" width="170" height="30" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="645" y="196" text-anchor="middle" font-size="10" fill="#334155">类型在模板白名单</text>
  <rect x="742" y="176" width="170" height="30" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="827" y="196" text-anchor="middle" font-size="10" fill="#334155">无孤儿边（端点存在）</text>
  <rect x="924" y="176" width="190" height="30" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="1019" y="196" text-anchor="middle" font-size="10" fill="#334155">无自环</text>

  <!-- 段2 -->
  <line x1="744" y1="218" x2="744" y2="236" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="354" y="240" width="780" height="76" rx="10" fill="#EFF6FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="378" y="264" font-size="12" font-weight="700" fill="#312E81">② 字段校验</text>
  <rect x="378" y="274" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="453" y="294" text-anchor="middle" font-size="10" fill="#334155">必填字段</text>
  <rect x="540" y="274" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="615" y="294" text-anchor="middle" font-size="10" fill="#334155">类型匹配</text>
  <rect x="702" y="274" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="777" y="294" text-anchor="middle" font-size="10" fill="#334155">枚举值</text>
  <rect x="864" y="274" width="250" height="30" rx="6" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="989" y="294" text-anchor="middle" font-size="10" font-weight="700" fill="#9F1239">PROPERTY_NOT_IN_SCHEMA 禁脏字段</text>

  <!-- 段3 -->
  <line x1="744" y1="316" x2="744" y2="334" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="354" y="338" width="780" height="76" rx="10" fill="#EFF6FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="378" y="362" font-size="12" font-weight="700" fill="#312E81">③ 条件必填（conditional_requirements，any_of / all_of）</text>
  <text x="378" y="382" font-size="10" fill="#475569">answer → answer_text / answer_ref 至少其一 ｜ query/menu/skill/workflow/agent → 对应 _ref 必填 ｜ confirm-required → 确认提示</text>
  <text x="378" y="400" font-size="10" fill="#475569">read-execute → capabilities / query_ref / api_or_workflow_id 至少其一 ｜ rag → knowledge_binding …共 10 条，跨字段约束不写死在代码</text>

  <!-- 输出 -->
  <line x1="744" y1="430" x2="744" y2="456" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="330" y="460" width="390" height="90" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
  <text x="525" y="486" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">valid:true → 返回 {stats, validation}</text>
  <text x="525" y="506" text-anchor="middle" font-size="10" fill="#15803D">apply 才允许落盘 · 发布才允许建版本</text>
  <text x="525" y="524" text-anchor="middle" font-size="10" fill="#15803D">isFilled 语义：false 布尔算已填，仅 undefined/null/'' 算缺失</text>
  <rect x="740" y="460" width="420" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="950" y="486" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7F1D1D">valid:false → errors 逐条明细，阻断</text>
  <text x="950" y="506" text-anchor="middle" font-size="10" fill="#B91C1C">哪个节点 · 违了哪条模板规则 · 缺什么</text>
  <text x="950" y="524" text-anchor="middle" font-size="10" font-weight="700" fill="#B91C1C">服务端强制阻断（不信任前端），无副作用</text>

  <!-- mock 说明 -->
  <rect x="330" y="570" width="830" height="46" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4"/>
  <text x="354" y="590" font-size="10.5" font-weight="700" fill="#92400E">mock 占位约定：mock:* 形式的未就绪引用 → 警告（MOCK_FULFILLMENT_REFERENCE）不阻断建图</text>
  <text x="354" y="607" font-size="10" fill="#B45309">质量审计列出全部 mock 引用 —— 发布前必须替换，带病发布被审计清单逼出</text>

  <!-- 底部：契约回归锁 -->
  <rect x="40" y="632" width="1120" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="64" y="655" font-size="10.5" font-weight="700" fill="#334155">契约回归锁（双向）：修复后的合入产物必须 0 错误（防改坏）＋ 修复前的漂移输出必须仍然报错（防"放宽校验求通过"的倒退）—— tests/knowledge-intake-contract.test.js</text>
</svg>
