<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="580" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="32" font-size="18" font-weight="700" fill="#0F172A">记忆闭环：召回 → 候选 → 治理 → 审计</text>
  <text x="40" y="52" font-size="11" fill="#64748B">governed_write 默认不直写 · 独立记忆控制面按谓词策略裁决 · 全程可审计</text>

  <!-- ── Stage 1: 召回 (top-left) ── -->
  <rect x="40" y="70" width="490" height="200" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8"/>
  <circle cx="72" cy="96" r="18" fill="#4F46E5"/>
  <text x="72" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">1</text>
  <text x="100" y="101" font-size="13" font-weight="700" fill="#312E81">召回</text>

  <rect x="60" y="118" width="450" height="140" rx="8" fill="#FFF" stroke="#C7D2FE"/>
  <text x="75" y="138" font-size="10" font-weight="600" fill="#312E81">按用途策略限定可用的记忆</text>
  <text x="75" y="156" font-size="9" fill="#475569">· 记忆类型：情节记忆 / 用户偏好 / 交易偏好等</text>
  <text x="75" y="170" font-size="9" fill="#475569">· 谓词（predicates）：限定可查询的关系维度</text>
  <text x="75" y="184" font-size="9" fill="#475569">· 条数上限：防止上下文膨胀</text>
  <text x="75" y="198" font-size="9" fill="#475569">· 敏感度上限：脱敏等级控制</text>
  <text x="75" y="216" font-size="9" font-weight="600" fill="#5B21B6">→ 上下文包注入对话（意图级 / 用户级策略文件）</text>
  <text x="75" y="234" font-size="8.5" fill="#64748B">策略文件声明式 · 可编辑 · 可扩展 · 可审计</text>
  <text x="75" y="252" font-size="8.5" fill="#64748B">前端实时显示"召回 N 条记忆 · 敏感度等级"</text>

  <!-- ── Stage 2: 候选 (top-right) ── -->
  <rect x="570" y="70" width="490" height="200" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
  <circle cx="602" cy="96" r="18" fill="#7C3AED"/>
  <text x="602" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">2</text>
  <text x="630" y="101" font-size="13" font-weight="700" fill="#4C1D95">候选</text>

  <rect x="590" y="118" width="450" height="140" rx="8" fill="#FFF" stroke="#C4B5FD"/>
  <text x="605" y="138" font-size="10" font-weight="600" fill="#5B21B6">run 成功结束后生成记忆候选 — 不直写</text>
  <text x="605" y="156" font-size="9" fill="#475569">· 情节记忆候选：本次对话的关键交互片段</text>
  <text x="605" y="170" font-size="9" fill="#475569">· 用户偏好候选：从对话中推断的用户习惯</text>
  <text x="605" y="184" font-size="9" fill="#475569">· 交易偏好候选：金额分摊 / 账户选择倾向</text>
  <text x="605" y="202" font-size="9" font-weight="600" fill="#991B1B">→ 候选进入 pending 队列，不直接写入记忆库</text>
  <text x="605" y="220" font-size="8.5" fill="#64748B">候选状态：pending（待裁决）</text>
  <text x="605" y="238" font-size="8.5" fill="#64748B">→ 提交治理控制面裁决</text>

  <!-- Arrow: 召回→候选 (horizontal, top) -->
  <line x1="530" y1="170" x2="568" y2="170" stroke="#475569" stroke-width="2.2" marker-end="url(#arrC)"/>
  <text x="549" y="162" text-anchor="middle" font-size="8.5" fill="#475569">对话结束后</text>

  <!-- ── Stage 3: 治理 (bottom-right) ── -->
  <rect x="570" y="300" width="490" height="200" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <circle cx="602" cy="326" r="18" fill="#DC2626"/>
  <text x="602" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">3</text>
  <text x="630" y="331" font-size="13" font-weight="700" fill="#7F1D1D">治理</text>

  <rect x="590" y="348" width="450" height="140" rx="8" fill="#FFF" stroke="#FECACA"/>
  <text x="605" y="368" font-size="10" font-weight="600" fill="#991B1B">独立记忆控制面按谓词策略裁决</text>
  <text x="605" y="386" font-size="9" fill="#475569">· allowedPurposes：允许的用途白名单</text>
  <text x="605" y="400" font-size="9" fill="#475569">· usagePolicy：使用策略（只读 / 可更新 / 可删除）</text>
  <text x="605" y="414" font-size="9" fill="#475569">· retentionDays：保留天数（到期自动清理）</text>
  <text x="605" y="428" font-size="9" fill="#475569">· requiredConsent：需用户同意的用途标记</text>
  <text x="605" y="446" font-size="9" font-weight="600" fill="#991B1B">→ governed_write 模式：默认受控写入</text>
  <text x="605" y="464" font-size="8.5" fill="#64748B">裁决结果：approved（写入）/ contested（争议）/ revoked（撤销）</text>
  <text x="605" y="482" font-size="8.5" fill="#64748B">agent-memory-control :8080 · Python 独立服务</text>

  <!-- Arrow: 候选→治理 (vertical, right) -->
  <line x1="815" y1="270" x2="815" y2="298" stroke="#475569" stroke-width="2.2" marker-end="url(#arrC)"/>

  <!-- ── Stage 4: 审计 (bottom-left) ── -->
  <rect x="40" y="300" width="490" height="200" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <circle cx="72" cy="326" r="18" fill="#059669"/>
  <text x="72" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">4</text>
  <text x="100" y="331" font-size="13" font-weight="700" fill="#065F46">审计</text>

  <rect x="60" y="348" width="450" height="140" rx="8" fill="#FFF" stroke="#A7F3D0"/>
  <text x="75" y="368" font-size="10" font-weight="600" fill="#065F46">记忆专区工作台 — 全状态可查可追溯</text>
  <text x="75" y="386" font-size="9" fill="#475569">· pending：待裁决的记忆候选</text>
  <text x="75" y="400" font-size="9" fill="#475569">· approved：已批准写入的记忆</text>
  <text x="75" y="414" font-size="9" fill="#475569">· contested：存在争议的记忆</text>
  <text x="75" y="428" font-size="9" fill="#475569">· revoked：已撤销的记忆</text>
  <text x="75" y="446" font-size="9" font-weight="600" fill="#065F46">→ 每条记忆：怎么来的 · 谁批准的 · 能否再用</text>
  <text x="75" y="464" font-size="8.5" fill="#64748B">bank-web 记忆工作台前端 · REST API /memory/workbench</text>
  <text x="75" y="482" font-size="8.5" fill="#64748B">全程可追溯 · 每条记忆有完整血缘链路</text>

  <!-- Arrow: 治理→审计 (horizontal, bottom, right to left) -->
  <line x1="570" y1="400" x2="532" y2="400" stroke="#475569" stroke-width="2.2" marker-end="url(#arrC)"/>
  <text x="551" y="392" text-anchor="middle" font-size="8.5" fill="#475569">裁决完成</text>

  <!-- Arrow: 审计→召回 (vertical, left, bottom to top, feedback) -->
  <line x1="285" y1="300" x2="285" y2="272" stroke="#475569" stroke-width="2.2" marker-end="url(#arrC)"/>
  <text x="268" y="288" text-anchor="middle" font-size="8.5" fill="#475569">下次召回</text>

  <!-- Bottom note -->
  <rect x="40" y="520" width="1020" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="60" y="540" font-size="10" font-weight="600" fill="#334155">闭环要点</text>
  <text x="60" y="558" font-size="9.5" fill="#475569">召回按用途策略限定 → 候选不直写 → 治理面 governed_write 裁决 → 审计工作台全状态可追溯 → 下次对话召回受治理结果约束</text>
</svg>
