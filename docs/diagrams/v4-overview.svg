<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="19" font-weight="700" fill="#0F172A">一句话概括 V4：整张图 = 一棵意图分类树 + 一本资源字典</text>
  <text x="40" y="66" font-size="12" fill="#64748B">树上只有意图节点（分类导航 + 业务功能）；资源不占树位，被有场景的节点 bindings 引用</text>

  <rect x="40" y="96" width="640" height="180" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="60" y="122" font-size="12.5" font-weight="700" fill="#334155">意图图谱（识别用）</text>
  <rect x="70" y="138" width="150" height="46" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="145" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">根节点</text>
  <text x="145" y="174" text-anchor="middle" font-size="9" fill="#64748B">xx银行 · 唯一</text>
  <line x1="145" y1="184" x2="145" y2="200" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="70" y="204" width="150" height="46" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="145" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">领域节点</text>
  <text x="145" y="240" text-anchor="middle" font-size="9" fill="#1D4ED8">财富管理/转账…</text>
  <line x1="220" y1="227" x2="246" y2="227" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="250" y="204" width="150" height="46" rx="8" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.8"/>
  <text x="325" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="#134E4A">分类节点</text>
  <text x="325" y="240" text-anchor="middle" font-size="9" fill="#0F766E">理财→基金 可多级</text>
  <line x1="400" y1="227" x2="426" y2="227" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="430" y="204" width="150" height="46" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="505" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="#78350F">leaf 功能节点</text>
  <text x="505" y="240" text-anchor="middle" font-size="9" fill="#92400E">有场景 · 承接话</text>
  <text x="620" y="170" font-size="10" fill="#64748B" text-anchor="middle">深度按业务实际</text>
  <text x="620" y="188" font-size="10" fill="#64748B" text-anchor="middle">不设上限</text>

  <rect x="720" y="96" width="440" height="180" rx="14" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="740" y="122" font-size="12.5" font-weight="700" fill="#0C4A6E">资源字典（执行/应答用）</text>
  <rect x="740" y="138" width="400" height="40" rx="8" fill="#FFFFFF" stroke="#7DD3FC"/>
  <text x="940" y="163" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0C4A6E">能力表 · kind 五种：mcp-tool / skill / workflow / agent / menu-nav</text>
  <rect x="740" y="186" width="194" height="40" rx="8" fill="#FFFFFF" stroke="#7DD3FC"/>
  <text x="837" y="211" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0C4A6E">FAQ 表</text>
  <rect x="946" y="186" width="194" height="40" rx="8" fill="#FFFFFF" stroke="#7DD3FC"/>
  <text x="1043" y="211" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0C4A6E">策略表</text>
  <text x="740" y="250" font-size="9.5" fill="#0369A1">定义一次 · 多处引用 · 改字典不动树</text>
  <path d="M580,227 H700 V190" fill="none" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#arrr)"/>
  <text x="640" y="252" font-size="9.5" fill="#B91C1C" font-weight="700">bindings 引用</text>
</svg>
