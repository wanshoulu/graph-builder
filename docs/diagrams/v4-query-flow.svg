<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="40" y="38" font-size="19" font-weight="700" fill="#0F172A">一次查询的完整流程 · 「卡里还有多少钱」引擎内部每一步</text>
  <text x="40" y="60" font-size="12" fill="#64748B">最高分 ≥100 时语义层不启用（本例词法精确命中 110，短路）；负例 −160 自压制；候选唯一且高置信时裁判只做确认</text>

  <!-- 输入 -->
  <rect x="40" y="90" width="210" height="56" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="145" y="113" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">用户输入</text>
  <text x="145" y="133" text-anchor="middle" font-size="10" font-style="italic" fill="#475569">「卡里还有多少钱」</text>

  <!-- 词法打分 -->
  <rect x="300" y="80" width="260" height="150" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="430" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#312E81">词法打分</text>
  <rect x="315" y="116" width="230" height="26" rx="5" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="430" y="133" text-anchor="middle" font-size="9.5" fill="#334155">『卡里还有多少钱』精确命中 110</text>
  <rect x="315" y="148" width="230" height="26" rx="5" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="430" y="165" text-anchor="middle" font-size="9.5" fill="#334155">候选1：余额查询（110）</text>
  <rect x="315" y="180" width="230" height="26" rx="5" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="430" y="197" text-anchor="middle" font-size="9.5" fill="#334155">候选2/3：明细查询等（低分）</text>
  <line x1="250" y1="130" x2="296" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 图谱扩召 -->
  <rect x="610" y="80" width="260" height="70" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="740" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">图谱扩召：补位</text>
  <text x="740" y="128" text-anchor="middle" font-size="9.5" fill="#64748B">种子分×边权重 · offers.65/同业务对象.60/同能力.55 · 封顶 80</text>
  <line x1="560" y1="115" x2="606" y2="115" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 最高分判断 -->
  <rect x="610" y="176" width="260" height="54" rx="27" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="740" y="199" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">最高分 ≥ 100 ？</text>
  <text x="740" y="218" text-anchor="middle" font-size="9.5" fill="#92400E">是（余额查询 110）</text>
  <line x1="740" y1="150" x2="740" y2="172" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 语义召回（被短路） -->
  <rect x="920" y="176" width="240" height="54" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1040" y="199" text-anchor="middle" font-size="10.5" font-weight="700" fill="#134E4A">语义召回（本例跳过）</text>
  <text x="1040" y="218" text-anchor="middle" font-size="9" fill="#0F766E">词法不足时才启用 · 封顶 108</text>
  <line x1="870" y1="203" x2="916" y2="203" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrs)"/>
  <text x="893" y="192" text-anchor="middle" font-size="8.5" fill="#64748B">否才走</text>

  <!-- 负例检查 -->
  <rect x="300" y="270" width="260" height="54" rx="27" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="430" y="293" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">候选命中负例 ？（自扣 160）</text>
  <text x="430" y="312" text-anchor="middle" font-size="9.5" fill="#7F1D1D">「查交易明细」压低明细查询</text>
  <path d="M740,230 V297 H564" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 裁判 -->
  <rect x="40" y="270" width="220" height="54" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="150" y="293" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4C1D95">裁判模型裁决</text>
  <text x="150" y="312" text-anchor="middle" font-size="9.5" fill="#4C1D95">只在候选集里选 · 给出理由</text>
  <line x1="300" y1="297" x2="264" y2="297" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 槽位判断 -->
  <rect x="40" y="360" width="220" height="54" rx="27" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="150" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">槽位齐了吗？查哪张卡</text>
  <text x="150" y="402" text-anchor="middle" font-size="9.5" fill="#92400E">缺槽位 → 追问</text>
  <line x1="150" y1="324" x2="150" y2="356" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 追问回路 -->
  <rect x="300" y="360" width="170" height="54" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="385" y="383" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">追问：您要查哪张卡？</text>
  <text x="385" y="402" text-anchor="middle" font-size="9" fill="#64748B">（question 字段原文）</text>
  <line x1="260" y1="387" x2="296" y2="387" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M385,414 V440 H150 V418" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrs)"/>
  <text x="268" y="436" font-size="8.5" fill="#64748B">答完回来补槽</text>

  <!-- 执行模式判断 -->
  <rect x="530" y="360" width="250" height="54" rx="27" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="655" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">executionMode ？</text>
  <text x="655" y="402" text-anchor="middle" font-size="9.5" fill="#92400E">槽位齐了 → 按执行模式分流</text>
  <path d="M150,414 V387 H526" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 三条执行路径 -->
  <rect x="530" y="460" width="230" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="645" y="483" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065F46">read-execute：直接调能力</text>
  <text x="645" y="502" text-anchor="middle" font-size="9.5" fill="#047857">balance_get → 余额卡片</text>
  <path d="M600,414 V440 H645 V456" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="790" y="460" width="200" height="56" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="890" y="483" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">confirm-required：确认后执行</text>
  <text x="890" y="502" text-anchor="middle" font-size="9.5" fill="#92400E">风险分级确认卡（L1/L2）</text>
  <path d="M740,387 H890 V456" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrs)"/>

  <rect x="1020" y="460" width="160" height="56" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="1100" y="483" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0C4A6E">knowledge-only：</text>
  <text x="1100" y="502" text-anchor="middle" font-size="9.5" fill="#0C4A6E">返回 FAQ 答案</text>
  <path d="M780,387 H1100 V456" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrs)"/>

  <!-- 输出 -->
  <rect x="40" y="460" width="440" height="100" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="260" y="486" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">结构化输出（唯一意图 + 证据 + 槽位 + 执行声明）</text>
  <text x="260" y="510" text-anchor="middle" font-size="10" fill="#047857">余额查询 · 精确命中 110 分 · read-execute · balance_get</text>
  <text x="260" y="532" text-anchor="middle" font-size="10" fill="#047857">→ 余额卡片（金额 + 可用余额 + 币种）</text>
  <path d="M526,488 H486" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 底部要点 -->
  <rect x="40" y="586" width="1140" height="36" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="60" y="609" font-size="10.5" fill="#475569">实线＝主路径　虚线＝按需路径　椭圆＝判定　矩形＝处理　分数梯度：词法 110 > 召回词 100 > 图谱扩召 80(封顶) > 子串 75 ｜ 语义排名赋分 108/104/100/96 ｜ 负例 −160</text>
</svg>
