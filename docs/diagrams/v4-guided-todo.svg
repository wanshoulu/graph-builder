<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="1100" height="640" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="32" font-size="18" font-weight="700" fill="#0F172A">台账驱动的受控编排 · GuidedTodo 动态规划</text>
  <text x="40" y="52" font-size="11" fill="#64748B">可信入参白名单生成步骤 · 台账校验拒绝幻觉 · BusinessLoopCoordinator 最多 4 次迭代</text>

  <!-- ── Top: 一句话 → 任务信封 ── -->
  <rect x="40" y="68" width="1020" height="80" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="60" y="90" font-size="12" font-weight="700" fill="#312E81">用户一句话 → 意图识别 → 任务信封</text>
  <text x="60" y="108" font-size="9.5" fill="#475569">例："查余额，给张三李四转100" → 1 查询 + 2 转账（跨域组合）</text>
  <text x="60" y="124" font-size="9.5" fill="#475569">→ IntentTaskEnvelope：已裁决意图 + 槽位填充 + 风险级 + 技能绑定</text>
  <text x="60" y="140" font-size="9.5" fill="#7C3AED">→ 可跨域组合多任务 · 共享槽位自动传递</text>

  <!-- Arrow down -->
  <line x1="550" y1="148" x2="550" y2="168" stroke="#475569" stroke-width="2.2" marker-end="url(#arrD)"/>

  <!-- ── Middle: 动态展开 GuidedTodo ── -->
  <rect x="40" y="170" width="1020" height="210" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="60" y="192" font-size="12" font-weight="700" fill="#4C1D95">动态展开 GuidedTodo 计划</text>

  <!-- Step 1: trusted input whitelist -->
  <rect x="60" y="204" width="460" height="78" rx="8" fill="#FFF" stroke="#C4B5FD"/>
  <text x="75" y="222" font-size="10" font-weight="600" fill="#5B21B6">① 步骤凭可信入参白名单生成</text>
  <text x="75" y="238" font-size="9" fill="#475569">不让模型自由选择能力 → 步骤序列由图谱 + 核心系统快照动态生成</text>
  <text x="75" y="252" font-size="9" fill="#475569">入参来源：任务信封（已裁决意图 + 槽位）+ 图谱节点声明（技能绑定 sha256）</text>
  <text x="75" y="266" font-size="9" fill="#475569">→ 技能包按视图白名单物化注入每次运行</text>

  <!-- Step 2: todo snapshot -->
  <rect x="540" y="204" width="500" height="78" rx="8" fill="#FFF" stroke="#C4B5FD"/>
  <text x="555" y="222" font-size="10" font-weight="600" fill="#5B21B6">② todo 快照带 revision 修订号 + 活动指针</text>
  <text x="555" y="238" font-size="9" fill="#475569">每次迭代生成 todo 快照（revision 号 + 活动指针 position）</text>
  <text x="555" y="252" font-size="9" fill="#475569">已交付目标翻平（done）· 活动指针前移（active）· 待执行（pending）</text>
  <text x="555" y="266" font-size="9" fill="#475569">已确认信息多轮之间永不丢失</text>

  <!-- Step 3: goal coverage validation -->
  <rect x="60" y="290" width="980" height="78" rx="8" fill="#FEF2F2" stroke="#F87171"/>
  <text x="75" y="308" font-size="10" font-weight="600" fill="#991B1B">③ 目标覆盖校验 — 模型幻觉步骤被拒</text>
  <text x="75" y="324" font-size="9" fill="#475569">校验逻辑：每个步骤必须覆盖信封声明的目标 · 步骤的能力绑定必须匹配图谱声明的技能</text>
  <text x="75" y="338" font-size="9" fill="#475569">模型生成的步骤如果不在可信白名单内 → 台账校验失败 → 该步骤被拒绝</text>
  <text x="75" y="352" font-size="9" fill="#475569">workflow-templates 只作引导模板（非固定步骤序列）→ 真正步骤每轮按图谱 + 核心系统快照动态生成</text>
  <text x="75" y="366" font-size="9" fill="#B91C1C">→ 结果：编排确定性由台账保障，不受模型随机性影响</text>

  <!-- Arrow down -->
  <line x1="550" y1="380" x2="550" y2="400" stroke="#475569" stroke-width="2.2" marker-end="url(#arrD)"/>

  <!-- ── Bottom: BusinessLoopCoordinator ── -->
  <rect x="40" y="402" width="1020" height="130" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="60" y="424" font-size="12" font-weight="700" fill="#92400E">BusinessLoopCoordinator · 台账驱动的业务循环</text>

  <!-- Iteration flow -->
  <rect x="60" y="438" width="180" height="76" rx="8" fill="#FFF" stroke="#FCD34D"/>
  <text x="150" y="458" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">迭代 1</text>
  <text x="150" y="474" text-anchor="middle" font-size="8.5" fill="#78350F">todo 快照 r1</text>
  <text x="150" y="488" text-anchor="middle" font-size="8.5" fill="#78350F">执行 → 对账</text>
  <text x="150" y="502" text-anchor="middle" font-size="8.5" fill="#059669">目标完成？→ 翻平</text>

  <!-- Arrow -->
  <line x1="240" y1="476" x2="258" y2="476" stroke="#475569" stroke-width="1.8" marker-end="url(#arrD)"/>

  <rect x="260" y="438" width="180" height="76" rx="8" fill="#FFF" stroke="#FCD34D"/>
  <text x="350" y="458" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">迭代 2</text>
  <text x="350" y="474" text-anchor="middle" font-size="8.5" fill="#78350F">todo 快照 r2</text>
  <text x="350" y="488" text-anchor="middle" font-size="8.5" fill="#78350F">活动指针前移</text>
  <text x="350" y="502" text-anchor="middle" font-size="8.5" fill="#059669">未完 → 继续</text>

  <line x1="440" y1="476" x2="458" y2="476" stroke="#475569" stroke-width="1.8" marker-end="url(#arrD)"/>

  <rect x="460" y="438" width="180" height="76" rx="8" fill="#FFF" stroke="#FCD34D"/>
  <text x="550" y="458" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">迭代 3</text>
  <text x="550" y="474" text-anchor="middle" font-size="8.5" fill="#78350F">todo 快照 r3</text>
  <text x="550" y="488" text-anchor="middle" font-size="8.5" fill="#78350F">确认卡 → 执行</text>
  <text x="550" y="502" text-anchor="middle" font-size="8.5" fill="#059669">目标完成？→ 翻平</text>

  <line x1="640" y1="476" x2="658" y2="476" stroke="#475569" stroke-width="1.8" marker-end="url(#arrD)"/>

  <rect x="660" y="438" width="180" height="76" rx="8" fill="#FEF2F2" stroke="#F87171"/>
  <text x="750" y="458" text-anchor="middle" font-size="10" font-weight="600" fill="#991B1B">迭代 4（上限）</text>
  <text x="750" y="474" text-anchor="middle" font-size="8.5" fill="#78350F">todo 快照 r4</text>
  <text x="750" y="488" text-anchor="middle" font-size="8.5" fill="#78350F">最后机会</text>
  <text x="750" y="502" text-anchor="middle" font-size="8.5" fill="#B91C1C">未完成 → 降级终止</text>

  <!-- Max iterations note -->
  <rect x="860" y="438" width="180" height="76" rx="8" fill="#F1F5F9" stroke="#64748B"/>
  <text x="950" y="460" text-anchor="middle" font-size="9.5" font-weight="600" fill="#475569">台账约束</text>
  <text x="950" y="476" text-anchor="middle" font-size="8.5" fill="#475569">revision 修订号</text>
  <text x="950" y="490" text-anchor="middle" font-size="8.5" fill="#475569">活动指针 position</text>
  <text x="950" y="504" text-anchor="middle" font-size="8.5" fill="#475569">目标覆盖校验</text>

  <!-- Bottom note -->
  <rect x="40" y="546" width="1020" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="60" y="568" font-size="10" font-weight="600" fill="#334155">关键机制总结</text>
  <text x="60" y="586" font-size="9.5" fill="#475569">① 不让模型自由选择能力 — 步骤凭可信入参白名单生成　·　② 台账校验拒绝幻觉步骤 — revision + 活动指针 + 目标覆盖</text>
  <text x="60" y="604" font-size="9.5" fill="#475569">③ 技能包按视图白名单物化注入 — 最小授权每次运行　·　④ workflow-templates 只作引导 — 真正步骤每轮动态生成</text>
</svg>
