<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#0F172A">节点层级总览 · root → domain → category（可多级）→ leaf</text>
  <text x="40" y="62" font-size="12" fill="#64748B">领域下可直接挂功能节点（简单业务），也可经多级分类再挂功能节点（复杂业务）——两种挂法都合法，深度不设上限</text>

  <!-- root -->
  <rect x="480" y="90" width="240" height="56" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/>
  <text x="600" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">root 根节点</text>
  <text x="600" y="134" text-anchor="middle" font-size="9.5" fill="#64748B">『XX银行』全图唯一</text>

  <!-- 分叉 -->
  <path d="M600,146 V170 H200 V196" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M600,146 V170 H600 V196" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M600,146 V170 H1000 V196" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- domain 行 -->
  <rect x="90" y="200" width="220" height="56" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="200" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">domain 领域节点</text>
  <text x="200" y="244" text-anchor="middle" font-size="9.5" fill="#1D4ED8">『财富管理』</text>
  <rect x="490" y="200" width="220" height="56" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="600" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">domain 领域节点</text>
  <text x="600" y="244" text-anchor="middle" font-size="9.5" fill="#1D4ED8">『转账服务』· 直挂功能节点</text>
  <rect x="890" y="200" width="220" height="56" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="1000" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">domain 领域节点</text>
  <text x="1000" y="244" text-anchor="middle" font-size="9.5" fill="#1D4ED8">『信用卡』</text>

  <!-- category 行（财富管理下） -->
  <path d="M200,256 V286 H160 V306" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="60" y="310" width="200" height="52" rx="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
  <text x="160" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="#134E4A">category 分类节点</text>
  <text x="160" y="350" text-anchor="middle" font-size="9.5" fill="#0F766E">『理财』一级功能</text>
  <path d="M160,362 V386 H150 V404" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="50" y="408" width="200" height="52" rx="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
  <text x="150" y="430" text-anchor="middle" font-size="11.5" font-weight="700" fill="#134E4A">category 分类节点</text>
  <text x="150" y="448" text-anchor="middle" font-size="9.5" fill="#0F766E">『基金』二级 · 按需任意扩展</text>

  <!-- 信用卡下分类 -->
  <path d="M1000,256 V306" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="890" y="310" width="220" height="52" rx="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
  <text x="1000" y="332" text-anchor="middle" font-size="11.5" font-weight="700" fill="#134E4A">category 分类节点</text>
  <text x="1000" y="350" text-anchor="middle" font-size="9.5" fill="#0F766E">『账单分期』</text>

  <!-- 功能节点：基金下三个 -->
  <line x1="250" y1="420" x2="320" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="324" y="396" width="180" height="44" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="414" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#78350F">leaf 功能节点</text>
  <text x="414" y="433" text-anchor="middle" font-size="9" fill="#92400E">『开通基金定投』</text>
  <line x1="250" y1="470" x2="320" y2="470" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="324" y="448" width="180" height="44" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="414" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#78350F">leaf 功能节点</text>
  <text x="414" y="485" text-anchor="middle" font-size="9" fill="#92400E">『修改定投计划』</text>

  <!-- 功能节点：转账直挂 -->
  <path d="M600,256 V306" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="490" y="310" width="200" height="48" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="590" y="331" text-anchor="middle" font-size="11" font-weight="700" fill="#78350F">leaf 功能节点</text>
  <text x="590" y="349" text-anchor="middle" font-size="9" fill="#92400E">『手机转账』· 领域直挂</text>

  <!-- 功能节点：账单分期下 -->
  <path d="M1000,362 V390" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="890" y="394" width="200" height="48" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="990" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#78350F">leaf 功能节点</text>
  <text x="990" y="433" text-anchor="middle" font-size="9" fill="#92400E">『分期规则咨询』</text>

  <!-- 右侧要点 -->
  <rect x="560" y="380" width="300" height="84" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <text x="580" y="404" font-size="10.5" font-weight="700" fill="#92400E">读图要点</text>
  <text x="580" y="424" font-size="9.5" fill="#78350F">· 分类节点可多级（理财→基金→…），层数不限</text>
  <text x="580" y="442" font-size="9.5" fill="#78350F">· 功能节点永远在树梢，下面不再有节点</text>
  <text x="580" y="458" font-size="9.5" fill="#78350F">· 转账服务直挂功能节点=简单业务；财富管理四级=复杂业务</text>
</svg>
