<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <text x="40" y="38" font-size="19" font-weight="700" fill="#0F172A">图谱本体结构 · 一棵意图分类树 + 资源字典</text>
  <text x="40" y="60" font-size="12" fill="#64748B">节点只有一种（intent，四种角色）；资源不做节点，被有场景的节点 bindings 引用；深度按业务实际，不设上限</text>

  <!-- ══ 意图图谱 ══ -->
  <rect x="40" y="86" width="640" height="440" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 3"/>
  <text x="60" y="110" font-size="12" font-weight="700" fill="#334155">intentTree 意图分类树（图的全部主体）</text>

  <!-- root -->
  <rect x="250" y="124" width="200" height="46" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="350" y="143" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F172A">root 根节点</text>
  <text x="350" y="160" text-anchor="middle" font-size="9.5" fill="#64748B">全图唯一 · 银行总入口</text>

  <!-- domain 行 -->
  <line x1="350" y1="170" x2="160" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="170" x2="350" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="170" x2="540" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="60" y="210" width="200" height="46" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="160" y="229" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E3A8A">domain 领域节点</text>
  <text x="160" y="246" text-anchor="middle" font-size="9.5" fill="#1D4ED8">账户管理 · 只配导航词</text>
  <rect x="250" y="210" width="200" height="46" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="350" y="229" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E3A8A">domain 领域节点</text>
  <text x="350" y="246" text-anchor="middle" font-size="9.5" fill="#1D4ED8">财富管理 · 一级业务分类</text>
  <rect x="440" y="210" width="200" height="46" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="540" y="229" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E3A8A">domain 领域节点</text>
  <text x="540" y="246" text-anchor="middle" font-size="9.5" fill="#1D4ED8">转账服务 · 领域直挂功能节点</text>

  <!-- category -->
  <line x1="350" y1="256" x2="350" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="240" y="296" width="220" height="46" rx="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.8"/>
  <text x="350" y="315" text-anchor="middle" font-size="11.5" font-weight="700" fill="#134E4A">category 分类节点（可多级）</text>
  <text x="350" y="332" text-anchor="middle" font-size="9.5" fill="#0F766E">理财 → 基金 → … 深度不限</text>

  <!-- leaf 行 -->
  <line x1="350" y1="342" x2="150" y2="378" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="342" x2="330" y2="378" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="342" x2="510" y2="378" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="50" y="382" width="200" height="52" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="150" y="403" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350F">leaf 功能节点</text>
  <text x="150" y="421" text-anchor="middle" font-size="9.5" fill="#92400E">开通基金定投 · DO 类</text>
  <rect x="230" y="382" width="200" height="52" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="330" y="403" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350F">leaf 功能节点</text>
  <text x="330" y="421" text-anchor="middle" font-size="9.5" fill="#92400E">修改定投计划 · CHANGE 类</text>
  <rect x="410" y="382" width="200" height="52" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="510" y="403" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350F">leaf 功能节点</text>
  <text x="510" y="421" text-anchor="middle" font-size="9.5" fill="#92400E">查定投记录 · QUERY 类</text>

  <!-- 节点内部八块 -->
  <rect x="50" y="446" width="600" height="66" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="350" y="466" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">节点内部按功能分块（联合定义）：</text>
  <text x="350" y="486" text-anchor="middle" font-size="9.5" fill="#475569">语义块(是什么) · 召回块(怎么说) · 任务块(收什么参数/办理) · 知识块(答案/咨询)</text>
  <text x="350" y="504" text-anchor="middle" font-size="9.5" fill="#475569">策略块(怎么路由) · 执行块(怎么执行) · 绑定块(用什么资源) · 可观测块(来源/审核)　——办理与咨询互斥</text>

  <!-- ══ 资源字典 ══ -->
  <rect x="720" y="86" width="440" height="250" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/>
  <text x="740" y="110" font-size="12" font-weight="700" fill="#0C4A6E">resourceRegistries 资源字典（定义一次，多处引用）</text>
  <rect x="740" y="122" width="400" height="52" rx="8" fill="#FFFFFF" stroke="#7DD3FC"/>
  <text x="940" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#0C4A6E">capabilities 能力表（kind 区分五种载体）</text>
  <text x="940" y="163" text-anchor="middle" font-size="9.5" fill="#0369A1">mcp-tool 接口 · skill 技能 · workflow 流程 · agent 智能体 · menu-nav 页面直达</text>
  <rect x="740" y="182" width="194" height="44" rx="8" fill="#FFFFFF" stroke="#7DD3FC"/>
  <text x="837" y="200" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0C4A6E">faqs 问答表</text>
  <text x="837" y="217" text-anchor="middle" font-size="9" fill="#0369A1">咨询类答案内容</text>
  <rect x="946" y="182" width="194" height="44" rx="8" fill="#FFFFFF" stroke="#7DD3FC"/>
  <text x="1043" y="200" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0C4A6E">policies 策略表</text>
  <text x="1043" y="217" text-anchor="middle" font-size="9" fill="#0369A1">风控/合规规则</text>
  <text x="740" y="252" font-size="9.5" fill="#0369A1">每条能力：id / title / kind / riskLevel(L0-L3) / writeOperation / provider</text>
  <text x="740" y="272" font-size="9.5" fill="#0369A1">riskLevel≥L2 或写操作 → 执行前必须用户确认（配置在数据里）</text>
  <text x="740" y="296" font-size="9.5" fill="#0369A1">V2 实测：39 个能力被 90 处引用（复用 2.3 次/个）——字典+引用</text>
  <text x="740" y="316" font-size="9.5" fill="#0369A1">比图节点+边直观；改一条 FAQ 只动字典不动图谱</text>

  <!-- 引用箭头：功能节点→字典 -->
  <path d="M250,435 H700 V190" fill="none" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#arrp)"/>
  <text x="560" y="428" font-size="10" fill="#B91C1C" font-weight="700">bindings 引用（capabilities / faqs / policies）</text>

  <!-- ══ 三类关系 ══ -->
  <rect x="720" y="356" width="440" height="170" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="740" y="380" font-size="12" font-weight="700" fill="#4C1D95">Edge 三类关系（只有第③类要显式写）</text>
  <text x="740" y="404" font-size="10" fill="#4C1D95">① 层级边：parent_intent_id 字段即边（构成整棵树，无环+前缀约束）</text>
  <text x="740" y="426" font-size="10" fill="#4C1D95">② 横切关系边：relations 数组（same_as 同一功能 / confusable_with 易混 / related_to 弱相关）</text>
  <text x="740" y="448" font-size="10" fill="#4C1D95">　　　带 evidence 证据 / owner / version，badcase 可追溯</text>
  <text x="740" y="470" font-size="10" fill="#4C1D95">③ 资源引用边：有场景的节点 bindings 块（每个节点一组，校验禁止悬空引用）</text>
  <text x="740" y="498" font-size="9.5" fill="#64748B">无 scenes 的节点只做分类路标（scope+导航词）；有 scenes 的节点有完整执行配置</text>
  <text x="740" y="516" font-size="9.5" fill="#64748B">能不能执行由节点声明的配置决定，与层级无关；root 不承载业务</text>

  <!-- 判定速记 -->
  <rect x="40" y="536" width="640" height="60" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <text x="60" y="558" font-size="10.5" font-weight="700" fill="#92400E">分层判定速记</text>
  <text x="60" y="578" font-size="9.5" fill="#78350F">用户会直接说 + 有独立说法/参数/执行方式 → 功能节点；只是帮用户缩小范围 → 分类；一级业务条线 → 领域</text>

  <text x="720" y="556" font-size="11" fill="#64748B">灰区=图谱　蓝区=字典　紫区=关系　黄区=功能节点　红线=引用</text>
</svg>
