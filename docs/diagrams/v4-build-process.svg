<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#FFFFFF"/>
  <text x="40" y="38" font-size="19" font-weight="700" fill="#0F172A">开发流程 · 六阶段闭环（程序生成与业务导入双路径并行）</text>
  <text x="40" y="60" font-size="12" fill="#64748B">每阶段有确定性验收门，不通过不上送；badcase 回流只改图谱数据（加别名/负例），不改代码</text>

  <!-- 六阶段主链 -->
  <rect x="40" y="96" width="170" height="86" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="125" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400E">① 业务盘点</text>
  <text x="125" y="142" text-anchor="middle" font-size="9.5" fill="#92400E">菜单按完整层级列出</text>
  <text x="125" y="160" text-anchor="middle" font-size="9.5" fill="#92400E">FAQ/能力/策略四清单</text>
  <line x1="210" y1="139" x2="236" y2="139" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="240" y="96" width="170" height="86" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8"/>
  <text x="325" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0C4A6E">② 骨架生成</text>
  <text x="325" y="142" text-anchor="middle" font-size="9.5" fill="#0C4A6E">构建器生成树+注册表</text>
  <text x="325" y="160" text-anchor="middle" font-size="9.5" fill="#0C4A6E">自动产 id 和 path</text>
  <line x1="410" y1="139" x2="436" y2="139" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="440" y="96" width="170" height="86" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8"/>
  <text x="525" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#312E81">③ 别名生产</text>
  <text x="525" y="142" text-anchor="middle" font-size="9.5" fill="#312E81">LLM 8意图/批×16条</text>
  <text x="525" y="160" text-anchor="middle" font-size="9.5" fill="#312E81">分类节点只产导航词</text>
  <line x1="610" y1="139" x2="636" y2="139" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="640" y="96" width="170" height="86" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="725" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7F1D1D">④ 自动校验</text>
  <text x="725" y="142" text-anchor="middle" font-size="9.5" fill="#7F1D1D">12 条硬规则全跑</text>
  <text x="725" y="160" text-anchor="middle" font-size="9.5" fill="#7F1D1D">0 错误才放行</text>
  <path d="M725,96 V76 H525 V92" fill="none" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrb)"/>
  <text x="625" y="70" text-anchor="middle" font-size="9" fill="#B91C1C">不通过 → 修正重生成</text>
  <line x1="810" y1="139" x2="836" y2="139" stroke="#059669" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="840" y="96" width="150" height="86" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="915" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065F46">⑤ 发布</text>
  <text x="915" y="142" text-anchor="middle" font-size="9.5" fill="#065F46">写文件+算 digest</text>
  <text x="915" y="160" text-anchor="middle" font-size="9.5" fill="#065F46">缓存自动失效</text>
  <line x1="990" y1="139" x2="1016" y2="139" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="1020" y="96" width="140" height="86" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="1090" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4C1D95">⑥ 评测回归</text>
  <text x="1090" y="142" text-anchor="middle" font-size="9.5" fill="#4C1D95">通过率≥上版</text>
  <text x="1090" y="160" text-anchor="middle" font-size="9.5" fill="#4C1D95">先存量域后新增域</text>

  <!-- badcase 回流大环 -->
  <path d="M1090,182 V232 H525 V188" fill="none" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrb)"/>
  <text x="800" y="226" text-anchor="middle" font-size="10" fill="#B91C1C" font-weight="700">badcase 回流：加别名/加负例/调混淆对 —— 改图不改码</text>

  <!-- 业务导入路径 -->
  <rect x="40" y="262" width="1120" height="118" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="60" y="288" font-size="12" font-weight="700" fill="#334155">并行路径 · 业务导入（知识导入工具 /ontomind/knowledge/graph/intake，业务人员参与的主力路径）</text>
  <rect x="60" y="302" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="160" y="326" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">一体化 Excel 填报</text>
  <text x="160" y="346" text-anchor="middle" font-size="9" fill="#64748B">功能行/意图行/说法行</text>
  <line x1="260" y1="333" x2="286" y2="333" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="290" y="302" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="390" y="326" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">候选层（不直接进图）</text>
  <text x="390" y="346" text-anchor="middle" font-size="9" fill="#64748B">人工审核 + AI 逐节点审核</text>
  <line x1="490" y1="333" x2="516" y2="333" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="520" y="302" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="620" y="326" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">LLM 补全</text>
  <text x="620" y="346" text-anchor="middle" font-size="9" fill="#64748B">缺的别名/负例/描述</text>
  <line x1="720" y1="333" x2="746" y2="333" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="750" y="302" width="190" height="62" rx="8" fill="#FEF2F2" stroke="#DC2626"/>
  <text x="845" y="326" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7F1D1D">验收报告</text>
  <text x="845" y="346" text-anchor="middle" font-size="9" fill="#7F1D1D">error阻断/warn/info 分级</text>
  <line x1="940" y1="333" x2="966" y2="333" stroke="#059669" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="970" y="302" width="170" height="62" rx="8" fill="#ECFDF5" stroke="#059669"/>
  <text x="1055" y="326" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065F46">入图（转 V4 节点）</text>
  <text x="1055" y="346" text-anchor="middle" font-size="9" fill="#047857">工具将升版对齐 V4</text>
</svg>
